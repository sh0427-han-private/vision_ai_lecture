<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-label="Anomaly score 0.82 is alarm if threshold .5 but normal if threshold .9, same score decision illustration"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24839a"/></marker></defs><rect width="1200" height="475" fill="white"/><text x="50" y="41" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" fill="#164660" font-weight="765">점수 하나에 Threshold를 적용하면 판정이 달라집니다</text><rect x="24" y="70" width="1149" height="343" rx="12" fill="#f9fbfc" stroke="#d8e6ec" stroke-width="2"/><text x="127" y="140" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#285d78" font-weight="760">불량 점수</text><rect x="58" y="178" width="220" height="90" rx="10" fill="#fff" stroke="#a8cbd9" stroke-width="2"/><text x="169" y="235" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="41" fill="#176f8a" font-weight="810">0.82</text><text x="171" y="304" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#66808f" font-weight="540">정답 정보는 별개</text><line x1="291" y1="227" x2="369" y2="227" stroke="#24839a" stroke-width="3" marker-end="url(#arr)"/><rect x="407" y="116" width="718" height="109" rx="12" fill="#e8f6ef" stroke="#aedac4" stroke-width="2"/><text x="530" y="158" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#375c6e" font-weight="720">기준 0.50</text><text x="760" y="158" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#1d8a6f" font-weight="780">0.82 ≥ 0.50</text><text x="993" y="158" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#1d8a6f" font-weight="800">불량 알람</text><text x="764" y="200" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" fill="#657c89" font-weight="530">기준이 낮을수록 알람이 늘 수 있음</text><rect x="407" y="252" width="718" height="109" rx="12" fill="#fff0e7" stroke="#e8c7b1" stroke-width="2"/><text x="530" y="294" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#375c6e" font-weight="720">기준 0.90</text><text x="760" y="294" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#b16447" font-weight="780">0.82 &lt; 0.90</text><text x="993" y="294" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#b16447" font-weight="800">정상 판정</text><text x="764" y="336" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" fill="#657c89" font-weight="530">기준이 높을수록 놓치는 불량이 늘 수 있음</text><rect x="124" y="423" width="967" height="43" rx="8" fill="#e6f5ee" stroke="#afd8c6" stroke-width="2"/><text x="604" y="452" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#177462" font-weight="745">같은 모델·같은 입력의 점수라도 기준에 따라 판정이 변합니다.</text></svg>