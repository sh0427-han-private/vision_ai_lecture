<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Vision AI is a repeatable improvement cycle"><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e8194">MODEL EVALUATION / 51</text><text x="54" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#254658">Vision AI is a repeatable improvement cycle</text><path d="M54 114L1386 114" fill="none" stroke="#e0ecf0" stroke-width="2"/><rect x="54" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="76" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Define the task</text><text x="76" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">What is a successful output?</text><rect x="116" y="264" width="307" height="106" rx="8" fill="#eff5f9" stroke="#d5e2e9" stroke-width="1.7"/><text x="141" y="306" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Class? Box? Mask?</text><text x="141" y="343" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Metric and target defined</text><rect x="510" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="532" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Data → train → evaluate</text><text x="532" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Develop a validated model</text><rect x="559" y="264" width="308" height="106" rx="8" fill="#eaf6ef" stroke="#cde2d4" stroke-width="1.7"/><text x="584" y="305" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Collect + label</text><text x="584" y="342" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#254658">Train / validate / test</text><rect x="966" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="988" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Deploy → monitor</text><text x="988" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Observe new operating conditions</text><rect x="1014" y="264" width="306" height="106" rx="8" fill="#fff6eb" stroke="#e8d5bb" stroke-width="1.7"/><text x="1041" y="305" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Release model</text><text x="1041" y="342" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">Track failure slices</text><rect x="54" y="516" width="1332" height="60" rx="9" fill="#f0f7f9" stroke="#d5e5e9" stroke-width="1.7"/><text x="77" y="552" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Requirements → dataset and labels → training → evaluation → deployment → monitoring.</text></svg>