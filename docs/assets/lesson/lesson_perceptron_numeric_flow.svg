<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Perceptron 두 입력 0.5, 1.0 에 가중치 0.2, 0.8 과 편향 -0.6을 적용하면 0.3이 되어 임계값 0을 통과해 1로 출력한다"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287f99"/></marker></defs><rect width="1200" height="460" fill="#fff"/><text x="65" y="47" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="750" fill="#16415e">같은 입력도 가중치에 따라 결과가 달라집니다</text><rect x="22" y="76" width="346" height="290" rx="10" fill="#f9fbfd" stroke="#cbdce6" stroke-width="2"/><rect x="402" y="76" width="390" height="290" rx="10" fill="#f9fbfd" stroke="#cbdce6" stroke-width="2"/><rect x="823" y="76" width="354" height="290" rx="10" fill="#f9fbfd" stroke="#cbdce6" stroke-width="2"/><text x="194" y="117" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" font-weight="750" fill="#1b526d">① 두 입력</text><rect x="56" y="158" width="275" height="72" rx="10" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="98" y="187" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#5a7786">밝기</text><text x="264" y="204" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="760" fill="#1e526b">x₁ = 0.5</text><rect x="56" y="246" width="275" height="72" rx="10" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="99" y="275" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#5a7786">모양</text><text x="264" y="291" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="760" fill="#1e526b">x₂ = 1.0</text><path d="M368 224L398 224" fill="none" stroke="#287f99" stroke-width="3.4" marker-end="url(#arrow)"/><text x="595" y="117" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#1b526d">② Weight를 곱하고 더하기</text><text x="597" y="171" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" font-weight="730" fill="#285974">0.5 × 0.2 = 0.10</text><text x="597" y="217" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" font-weight="730" fill="#285974">1.0 × 0.8 = 0.80</text><text x="597" y="263" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" font-weight="730" fill="#a16b48">Bias = −0.60</text><rect x="472" y="281" width="249" height="59" rx="10" fill="#e6f3f7" stroke="#95c7d6" stroke-width="2"/><text x="596" y="319" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="760" fill="#146c83">합계 z = 0.30</text><path d="M792 224L819 224" fill="none" stroke="#287f99" stroke-width="3.4" marker-end="url(#arrow)"/><text x="1000" y="117" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#1b526d">③ Activation → 출력</text><rect x="868" y="156" width="262" height="61" rx="10" fill="#fff" stroke="#cbdce6" stroke-width="2"/><text x="999" y="194" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="740" fill="#214e64">z ≥ 0 ?</text><path d="M1000 219L1000 246" fill="none" stroke="#287f99" stroke-width="3.4" marker-end="url(#arrow)"/><rect x="872" y="251" width="252" height="79" rx="10" fill="#e8f6ed" stroke="#a0d5bd" stroke-width="2"/><text x="999" y="281" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" font-weight="790" fill="#147d61">Yes → y = 1</text><text x="999" y="307" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" font-weight="600" fill="#2c7769">예시 기준: 사과</text><rect x="162" y="391" width="868" height="51" rx="10" fill="#edf6f8" stroke="#badbe2" stroke-width="2"/><text x="596" y="423" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="620" fill="#46697b">이 숫자와 Weight는 계산을 설명하기 위한 가상 예시입니다.</text></svg>