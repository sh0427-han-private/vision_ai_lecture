<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Split video data by recording group"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769ba5"/></marker></defs><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="18" font-weight="700" fill="#338493">DATA AND TRANSFER LEARNING / 40</text><text x="54" y="93" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="35" font-weight="700" fill="#28495b">Split video data by recording group</text><path d="M54 113H1386" stroke="#e1eaf0" stroke-width="2"/><rect x="54" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="75" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">One video</text><text x="75" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Adjacent frames are similar</text><rect x="99" y="252" width="104" height="76" rx="4" fill="#ecf2ef" stroke="#bed0d8" stroke-width="1.7"/><g transform="translate(126 265) scale(0.25)"><ellipse cx="98" cy="191" rx="70" ry="12" fill="#e2e9e4"/><path d="M96 46C52 17 17 48 19 109C20 159 50 184 94 173C142 191 178 162 177 110C176 53 143 20 96 46Z" fill="#d75c62" stroke="#a84c56" stroke-width="3"/><ellipse cx="57" cy="81" rx="22" ry="10" fill="#f7aeb2" opacity=".65" transform="rotate(-25 57 81)"/><path d="M95 46Q95 19 111 5" fill="none" stroke="#75543d" stroke-width="7"/><path d="M111 26Q138 -5 173 17Q143 36 111 26Z" fill="#73ad84" stroke="#477e60" stroke-width="2"/></g><text x="151" y="352" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#587382">t=0s</text><rect x="234" y="252" width="104" height="76" rx="4" fill="#e6efed" stroke