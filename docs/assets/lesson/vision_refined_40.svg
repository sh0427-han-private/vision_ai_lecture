iddle" font-size="16" font-weight="700" fill="#587382">Train</text><rect x="698" y="252" width="104" height="76" rx="4" fill="#fff3e6" stroke="#bed0d8" stroke-width="1.7"/><g transform="translate(725 265) scale(0.25)"><ellipse cx="98" cy="191" rx="70" ry="12" fill="#e2e9e4"/><path d="M96 46C52 17 17 48 19 109C20 159 50 184 94 173C142 191 178 162 177 110C176 53 143 20 96 46Z" fill="#d75c62" stroke="#a84c56" stroke-width="3"/><ellipse cx="57" cy="81" rx="22" ry="10" fill="#f7aeb2" opacity=".65" transform="rotate(-25 57 81)"/><path d="M95 46Q95 19 111 5" fill="none" stroke="#75543d" stroke-width="7"/><path d="M111 26Q138 -5 173 17Q143 36 111 26Z" fill="#73ad84" stroke="#477e60" stroke-width="2"/></g><text x="750" y="352" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#587382">Test</text><text x="540" y="436" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Metrics can look inflated</text><rect x="966" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="987" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Group-wise split</text><text x="987" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Keep each video in one set</text><rect x="1008" y="258" width="145" height="102" rx="7" fill="#dff2e8" stroke="#bedacf" stroke-width="1.7"/><rect x="1183" y="258" width="145" height="102" rx="7" fill="#edf4f8" stroke="#bed4df" stroke-width="1.7"/><text x="1023" y="315" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#28495b">Video A</text><text x="1196" y="315" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#28495b">Video B</text><text x="994" y="439" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Different sources for evaluation</text><rect x="54" y="516" width="1332" height="60" rx="10" fill="#f0f7f8" stroke="#d8e7ea" stroke-width="1.7"/><text x="78" y="551" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Video-level grouping prevents frames from one recording entering both train and test.</text></svg>