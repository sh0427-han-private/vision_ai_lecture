<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Confidence threshold changes detections"><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e8194">MODEL EVALUATION / 46</text><text x="54" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#254658">Confidence threshold changes detections</text><path d="M54 114L1386 114" fill="none" stroke="#e0ecf0" stroke-width="2"/><rect x="54" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="76" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Confidence threshold</text><text x="76" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Decision criterion τ = 0.70</text><rect x="118" y="263" width="267" height="91" rx="7" fill="#f0f6f8" stroke="#c6d9df" stroke-width="1.7"/><text x="144" y="314" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#254658">Threshold = 0.70</text><text x="87" y="448" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Rule: score ≥ τ → accept</text><rect x="510" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="532" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Detection A</text><text x="532" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Score = 0.82</text><rect x="570" y="273" width="299" height="86" rx="6" fill="#e5f5ed" stroke="#b9dccc" stroke-width="1.7"/><text x="611" y="329" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#2d856b">0.82 ≥ 0.70</text><text x="539" y="450" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">Accepted / kept</text><rect x="966" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="988" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Detection B</text><text x="988" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Score = 0.65</text><rect x="1024" y="273" width="300" height="86" rx="6" fill="#fff1ea" stroke="#e6ccb9" stroke-width="1.7"/><text x="1057" y="329" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#ae6d58">0.65 &lt; 0.70</text><text x="995" y="450" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">Rejected by this threshold</text><rect x="54" y="516" width="1332" height="60" rx="9" fill="#f0f7f9" stroke="#d5e5e9" stroke-width="1.7"/><text x="77" y="552" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Changing the threshold changes false-alarm and missed-detection trade-offs.</text></svg>