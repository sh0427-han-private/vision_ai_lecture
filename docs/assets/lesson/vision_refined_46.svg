<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="The same detection score 0.82 changes decision at thresholds 0.50 and 0.90"><rect width="1440" height="610" fill="#fff"/><text x="54" y="49" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#347f90">MODEL EVALUATION / 46</text><text x="54" y="91" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#2b5060">Changing threshold changes the decision</text><path d="M54 113H1386" stroke="#e0edf0" stroke-width="2"/><rect x="54" y="142" width="420" height="337" rx="13" fill="#fff" stroke="#c9dae3" stroke-width="1.7"/><text x="77" y="181" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2b5060">Model prediction</text><text x="77" y="209" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#68818e">Illustrative prediction</text><rect x="115" y="264" width="299" height="113" rx="13" fill="#eff5f7" stroke="#c9dae3" stroke-width="1.7"/><text x="145" y="310" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2b5060">Score = 0.82</text><text x="145" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#2b5060">Same score in both cases</text><text x="85" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2b5060">Score and threshold are separate.</text><rect x="510" y="142" width="420" height="337" rx="13" fill="#fff" stroke="#c9dae3" stroke-width="1.7"/><text x="533" y="181" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2b5060">Threshold = 0.50</text><text x="533" y="209" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#68818e">Lower decision threshold</text><rect x="571" y="264" width="299" height="113" rx="13" fill="#e6f6ed" stroke="#c9dae3" stroke-width="1.7"/><text x="601" y="310" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2b5060">0.82 ≥ 0.50</text><text x="601" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#2b5060">Accepted as positive</text><text x="541" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2b5060">Score and threshold are separate.</text><rect x="966" y="142" width="420" height="337" rx="13" fill="#fff" stroke="#c9dae3" stroke-width="1.7"/><text x="989" y="181" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2b5060">Threshold = 0.90</text><text x="989" y="209" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#68818e">Higher decision threshold</text><rect x="1027" y="264" width="299" height="113" rx="13" fill="#fff2ea" stroke="#c9dae3" stroke-width="1.7"/><text x="1057" y="310" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2b5060">0.82 &lt; 0.90</text><text x="1057" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#2b5060">Rejected as negative</text><text x="997" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2b5060">Score and threshold are separate.</text><rect x="54" y="516" width="1332" height="60" rx="13" fill="#edf7f8" stroke="#d7e6ea" stroke-width="1.7"/><text x="77" y="553" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2b5060">A lower threshold may increase recall and false alarms; select it using validation data.</text></svg>