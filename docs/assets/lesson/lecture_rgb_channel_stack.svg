<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-label="RGB는 실제 3D 공간이 아니라 R G B 채널 세 개의 숫자 배열"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1a819c"/></marker></defs><rect width="1280" height="610" fill="#fff"/><text x="60" y="64" font-size="38" fill="#0c314e" font-weight="800" text-anchor="start">RGB 이미지는 '세 장의 2D 숫자 배열'입니다</text><text x="60" y="105" font-size="23" fill="#5e7385" font-weight="450" text-anchor="start">공간적인 3D 깊이(Z)가 아니라, 한 위치의 색상 값 3개를 쌓아 표현합니다.</text><rect x="42" y="145" width="720" height="390" rx="16" fill="#f7fafc" stroke="#deeaef" stroke-width="2"/><rect x="795" y="145" width="440" height="390" rx="16" fill="#f7fafc" stroke="#deeaef" stroke-width="2"/><g transform="translate(124,205) skewX(-23)"><rect width="360" height="210" fill="#d95157" fill-opacity=".20" stroke="#d95157" stroke-width="3"/><path d="M0 0V210 M45 0V210 M90 0V210 M135 0V210 M180 0V210 M225 0V210 M270 0V210 M315 0V210 M0 0H360 M0 42H360 M0 84H360 M0 126H360 M0 168H360 M0 210H360" stroke="#d95157" stroke-opacity=".38" stroke-width="1.8"/></g><rect x="62" y="223" width="66" height="40" rx="8" fill="#fff" stroke="#d95157" stroke-width="2"/><text x="95" y="251" font-size="24" fill="#d95157" font-weight="800" text-anchor="middle">R</text><g transform="translate(236,281) skewX(-23)"><rect width="360" height="210" fill="#34a36f" fill-opacity=".20" stroke="#34a36f" stroke-width="3"/><path d="M0 0V210 M45 0V210 M90 0V210 M135 0V210 M180 0V210 M225 0V210 M270 0V210 M315 0V210 M0 0H360 M0 42H360 M0 84H360 M0 126H360 M0 168H360 M0 210H360" stroke="#34a36f" stroke-opacity=".38" stroke-width="1.8"/></g><rect x="174" y="299" width="66" height="40" rx="8" fill="#fff" stroke="#34a36f" stroke-width="2"/><text x="207" y="327" font-size="24" fill="#34a36f" font-weight="800" text-anchor="middle">G</text><g transform="translate(348,357) skewX(-23)"><rect width="360" height="210" fill="#4582c9" fill-opacity=".20" stroke="#4582c9" stroke-width="3"/><path d="M0 0V210 M45 0V210 M90 0V210 M135 0V210 M180 0V210 M225 0V210 M270 0V210 M315 0V210 M0 0H360 M0 42H360 M0 84H360 M0 126H360 M0 168H360 M0 210H360" stroke="#4582c9" stroke-opacity=".38" stroke-width="1.8"/></g><rect x="286" y="375" width="66" height="40" rx="8" fill="#fff" stroke="#4582c9" stroke-width="2"/><text x="319" y="403" font-size="24" fill="#4582c9" font-weight="800" text-anchor="middle">B</text><text x="83" y="570" font-size="24" fill="#4c687a" font-weight="550" text-anchor="start">가로 W × 세로 H : 세 채널 모두 동일한 위치 격자</text><text x="835" y="205" font-size="28" fill="#143d5c" font-weight="700" text-anchor="start">한 위치 (x, y)에서</text><rect x="833" y="236" width="330" height="56" rx="9" fill="#fff" stroke="#d7e5eb" stroke-width="2"/><rect x="847" y="250" width="29" height="29" rx="5" fill="#d95157" stroke="#d95157" stroke-width="2"/><text x="895" y="274" font-size="29" fill="#233f55" font-weight="700" text-anchor="start">R = 98</text><rect x="833" y="309" width="330" height="56" rx="9" fill="#fff" stroke="#d7e5eb" stroke-width="2"/><rect x="847" y="323" width="29" height="29" rx="5" fill="#34a36f" stroke="#34a36f" stroke-width="2"/><text x="895" y="347" font-size="29" fill="#233f55" font-weight="700" text-anchor="start">G = 67</text><rect x="833" y="382" width="330" height="56" rx="9" fill="#fff" stroke="#d7e5eb" stroke-width="2"/><rect x="847" y="396" width="29" height="29" rx="5" fill="#4582c9" stroke="#4582c9" stroke-width="2"/><text x="895" y="420" font-size="29" fill="#233f55" font-weight="700" text-anchor="start">B = 38</text><rect x="830" y="480" width="366" height="62" rx="12" fill="#e5f4f0" stroke="#80c5b2" stroke-width="2"/><text x="1013" y="520" font-size="22" fill="#137362" font-weight="700" text-anchor="middle">H × W × 3 = 색상 채널 3개</text></svg>