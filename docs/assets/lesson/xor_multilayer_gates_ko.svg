<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-label="입력 x1 x2가 NAND와 OR 은닉 뉴런으로 전달되고 두 출력을 AND 뉴런에 넣어 XOR를 계산"><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;font-size:22px;fill:#294e60}.small{font-size:19px;fill:#617887}.bold{font-weight:700}.green{fill:#137b66}.line{stroke:#8da8b5;stroke-width:2;fill:none}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8b5"/></marker></defs><rect width="1120" height="390" fill="white"/><text x="100" y="35" text-anchor="middle" class="">입력층</text><text x="510" y="35" text-anchor="middle" class="">은닉층 · 두 퍼셉트론</text><text x="1000" y="35" text-anchor="middle" class="">출력층</text><path d="M140 140L365 110" class="line" marker-end="url(#a)"/><path d="M140 140L365 275" class="line" marker-end="url(#a)"/><path d="M140 260L365 110" class="line" marker-end="url(#a)"/><path d="M140 260L365 275" class="line" marker-end="url(#a)"/><path d="M655 110L860 200" class="line" marker-end="url(#a)"/><path d="M655 275L860 200" class="line" marker-end="url(#a)"/><circle cx="100" cy="140" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="100" y="148" text-anchor="middle" class="bold">x₁</text><circle cx="100" cy="260" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="100" y="268" text-anchor="middle" class="bold">x₂</text><rect x="380" y="55" width="260" height="110" rx="5" fill="#f0f7f4" stroke="#9ab8b0"/><text x="510" y="89" text-anchor="middle" class="bold green">NAND</text><text x="510" y="125" text-anchor="middle" class="small">가중합 + Step</text><text x="510" y="196" text-anchor="middle" class="small">h₁ = Step(−0.5x₁−0.5x₂+0.7)</text><rect x="380" y="220" width="260" height="110" rx="5" fill="#f0f7f4" stroke="#9ab8b0"/><text x="510" y="254" text-anchor="middle" class="bold green">OR</text><text x="510" y="290" text-anchor="middle" class="small">가중합 + Step</text><text x="510" y="361" text-anchor="middle" class="small">h₂ = Step(0.5x₁+0.5x₂−0.2)</text><rect x="875" y="145" width="220" height="110" rx="5" fill="#e3f1ec" stroke="#8cbaaa"/><text x="985" y="181" text-anchor="middle" class="bold green">AND → XOR</text><text x="985" y="219" text-anchor="middle" class="small">y = Step(0.5h₁</text><text x="985" y="244" text-anchor="middle" class="small">+0.5h₂−0.7)</text><text x="560" y="385" text-anchor="middle" class="bold">각 게이트는 가중합 다음에 비선형 Step 함수를 적용합니다.</text></svg>