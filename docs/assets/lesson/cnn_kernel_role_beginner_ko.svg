<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">CNN Kernel: 작은 이미지 영역을 반복해서 살펴보는 필터</title>
<desc id="desc">실제 강아지 사진의 작은 주변 픽셀을 3×3 학습 가중치 배열로 계산하고 같은 가중치를 이동해 위치별 반응 지도를 만든다는 CNN 합성곱의 기본 개념도. 오른쪽 반응 지도는 학습 CNN의 실측 결과가 아닌 개념적 예시다.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" orient="auto" markerWidth="7" markerHeight="7"><path d="M0 0 L9 5 L0 10Z" fill="#7297a5"/></marker>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}.h{font-size:29px;font-weight:800;fill:#24495b}.k{font-size:17px;font-weight:750;fill:#388091}.st{font-size:24px;font-weight:800;fill:#274b5e}.sub{font-size:18px;fill:#577483}.note{font-size:17px;fill:#547382}.w{font-size:27px;font-weight:800;fill:#3b7380}.bottom{font-size:21px;font-weight:800;fill:#27546a}</style>
</defs>
<rect width="1440" height="560" fill="white"/>
<text x="35" y="48" class="h" >Kernel의 역할: 사진의 작은 부분을 반복해서 계산</text>
<path d="M35 67 H1405" stroke="#dfeaec" stroke-width="2"/>
<rect x="35" y="88" width="385" height="372" rx="16" fill="#f8fbfc" stroke="#d3e3e9" stroke-width="2"/>
<rect x="500" y="88" width="385" height="372" rx="16" fill="#f8fbfc" stroke="#d3e3e9" stroke-width="2"/>
<rect x="965" y="88" width="440" height="372" rx="16" fill="#f8fbfc" stroke="#d3e3e9" stroke-width="2"/>
<text x="56" y="124" class="k" >① 작은 이미지 영역</text>
<text x="56" y="161" class="st" >전체 사진 중 일부 Pixel</text>
<text x="56" y="195" class="sub" >이웃한 숫자들을 함께 사용</text>
<svg x="81" y="220" width="290" height="207" viewBox="0 0 180 132" preserveAspectRatio="xMidYMid meet">
  <image href="cs231n_vgg16_feature_hierarchy_original.png" x="-11" y="-1" width="1134" height="541"/>
  <rect x="45" y="30" width="41" height="41" fill="#f7cb64" fill-opacity=".17" stroke="#ffdb71" stroke-width="4"/>
  <rect x="105" y="74" width="32" height="32" fill="#73d1cf" fill-opacity=".16" stroke="#62c9c6" stroke-width="4"/>
</svg>
<text x="225" y="447" class="note" text-anchor="middle">노란 박스 · 옮겨 가며 계산</text>
<path d="M423 293 H490" stroke="#7297a5" stroke-width="4" marker-end="url(#arr)" fill="none"/>
<text x="520" y="124" class="k" >② 같은 Kernel</text>
<text x="520" y="161" class="st" >3×3 학습 가중치</text>
<text x="520" y="195" class="sub" >위치를 바꿔도 같은 값 사용</text>
