<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Forward → Loss → Backward → Update"><defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7597a5"/></marker></defs><rect width="1440" height="610" fill="white"/><text x="54" y="50" text-anchor="start" font-size="18" font-weight="800" fill="#2c8292" font-family="Arial,Helvetica,sans-serif">TRAINING MECHANICS / 34</text><text x="54" y="93" text-anchor="start" font-size="35" font-weight="800" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Forward → Loss → Backward → Update</text><path d="M54 114H1386" stroke="#dfeaf0" stroke-width="2"/><rect x="54" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="76" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">1. Forward pass</text><text x="76" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Image → predicted results</text><rect x="108" y="248" width="291" height="119" rx="12" fill="#eaf4f8" stroke="#c8dce5" stroke-width="1.8"/><text x="135" y="299" text-anchor="start" font-size="25" font-weight="800" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Model(weights)</text><text x="137" y="341" text-anchor="start" font-size="22" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Class / Box output</text><rect x="510" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="532" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">2. Compute loss</text><text x="532" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Compare prediction to label</text><rect x="565" y="255" width="308" height="118" rx="12" fill="#fff5ea" stroke="#ecd8b9" stroke-width="1.8"/><text x="588" y="304" text-anchor="start" font-size="22" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Prediction vs. target</text><text x="593" y="346" text-anchor="start" font-size="23" font-weight="800" fill="#b2763b" font-family="Arial,Helvetica,sans-serif">Loss = mismatch</text><rect x="966" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="988" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">3. Update weights</text><text x="988" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Gradient → optimizer step</text><rect x="1014" y="257" width="321" height="119" rx="12" fill="#eaf5ef" stroke="#c9ddce" stroke-width="1.8"/><text x="1040" y="304" text-anchor="start" font-size="24" font-weight="800" fill="#28495a" font-family="Arial,Helvetica,sans-serif">w ← w − η · gradient</text><text x="1040" y="345" text-anchor="start" font-size="21" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Repeat for more batches</text><rect x="54" y="516" width="1332" height="60" rx="10" fill="#eff7f8" stroke="#d4e3e8" stroke-width="1.8"/><text x="77" y="551" text-anchor="start" font-size="19" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Training repeats this loop until a stopping criterion; loss reduction is not guaranteed each step.</text></svg>