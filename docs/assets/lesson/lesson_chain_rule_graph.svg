ke-width="2"/><text x="747" y="108" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="650" fill="#5a7a8b">오차</text><text x="747" y="143" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="750" fill="#1a526c">e = ŷ−y = −2</text><path d="M876 120 L906 120" fill="none" stroke="#3e8195" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="916" y="80" width="247" height="82" rx="11" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="1039" y="108" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="650" fill="#5a7a8b">Loss</text><text x="1039" y="143" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="750" fill="#b26341">L = e² = 4</text><path d="M1040 189 L1040 223" fill="none" stroke="#3e8195" stroke-width="3.5" marker-end="url(#arrow)"/><text x="58" y="229" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="750" fill="#a95144">BACKWARD  |  Loss에서 Parameter로 미분값을 계산합니다</text><rect x="24" y="245" width="1152" height="149" rx="12" fill="#fff9f7" stroke="#efd7ce" stroke-width="2"/><rect x="52" y="269" width="328" height="97" rx="11" fill="#fff" stroke="#e8c9bc" stroke-width="2"/><text x="216" y="303" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="710" fill="#965143">① Loss → 예측</text><text x="216" y="346" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="780" fill="#7c4740">∂L/∂ŷ = 2e = −4</text><rect x="430" y="269" width="328" height="97" rx="11" fill="#fff" stroke="#e8c9bc" stroke-width="2"/><text x="594" y="303" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="710" fill="#965143">② 예측 → Weight</text><text x="594" y="346" text-anchor="middle" font-family="Noto Sans 