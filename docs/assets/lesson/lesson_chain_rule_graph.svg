<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Forward Backward 계산 그래프로 x 2 y 4 w 1 b 0 Loss 4와 Chain Rule gradients dw -8 db -4 및 SGD 후 loss 0"><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3e8195"/></marker><marker id="greenArrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18846c"/></marker></defs><rect width="1200" height="490" fill="#fff"/><text x="54" y="35" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="780" fill="#1b556f">FORWARD  |  숫자가 왼쪽에서 오른쪽으로 흐릅니다</text><rect x="24" y="55" width="1152" height="133" rx="12" fill="#f7fafc" stroke="#d7e5eb" stroke-width="2"/><rect x="40" y="80" width="247" height="82" rx="11" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="163" y="108" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="650" fill="#5a7a8b">입력·Parameter</text><text x="163" y="143" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="750" fill="#1a526c">x=2  ·  w=1  ·  b=0</text><path data-arrow-shape="solid" data-arrow-x1="297" data-arrow-y1="120" data-arrow-x2="322" data-arrow-y2="120" d="M297 121.72 L312.25 121.72 L312.25 126.7 L322 120 L312.25 113.3 L312.25 118.29 L297 118.29 Z" fill="#3e8195"/><rect x="332" y="80" width="247" height="82" rx="11" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="455" y="108" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="650" fill="#5a7a8b">예측값</text><text x="455" y="143" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="750" fill="#1a526c">ŷ = wx+b = 2</text><path data-arrow-shape="solid" data-arrow-x1="589" data-arrow-y1="120" data-arrow-x2="614" data-arrow-y2="120" d="M589 121.72 L604.25 121.72 L604.25 126.7 L614 120 L604.25 113.3 L604.25 118.29 L589 118.29 Z" fill="#3e8195"/><rect x="624" y="80" width="247" height="82" rx="11" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="747" y="108" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="650" fill="#5a7a8b">오차</text><text x="747" y="143" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="750" fill="#1a526c">e = ŷ−y = −2</text><path data-arrow-shape="solid" data-arrow-x1="881" data-arrow-y1="120" data-arrow-x2="906" data-arrow-y2="120" d="M881 121.72 L896.25 121.72 L896.25 126.7 L906 120 L896.25 113.3 L896.25 118.29 L881 118.29 Z" fill="#3e8195"/><rect x="916" y="80" width="247" height="82" rx="11" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="1039" y="108" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="650" fill="#5a7a8b">Loss</text><text x="1039" y="143" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="750" fill="#b26341">L = e² = 4</text><path data-arrow-shape="solid" data-arrow-x1="1040" data-arrow-y1="189" data-arrow-x2="1040" data-arrow-y2="223" d="M1038.29 189 L1038.29 213 L1033.3 213 L1040 223 L1046.7 213 L1041.71 213 L1041.71 189 Z" fill="#3e8195"/><text x="58" y="229" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="750" fill="#a95144">BACKWARD  |  Loss에서 Parameter로 미분값을 계산합니다</text><rect x="24" y="245" width="1152" height="149" rx="12" fill="#fff9f7" stroke="#efd7ce" stroke-width="2"/><rect x="52" y="269" width="328" height="97" rx="11" fill="#fff" stroke="#e8c9bc" stroke-width="2"/><text x="216" y="303" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="710" fill="#965143">① Loss → 예측</text><text x="216" y="346" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="780" fill="#7c4740">∂L/∂ŷ = 2e = −4</text><rect x="430" y="269" width="328" height="97" rx="11" fill="#fff" stroke="#e8c9bc" stroke-width="2"/><text x="594" y="303" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="710" fill="#965143">② 예측 → Weight</text><text x="594" y="346" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="780" fill="#7c4740">∂L/∂w = (−4) × 2 = −8</text><rect x="808" y="269" width="328" height="97" rx="11" fill="#fff" stroke="#e8c9bc" stroke-width="2"/><text x="972" y="303" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="710" fill="#965143">③ 예측 → Bias</text><text x="972" y="346" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="780" fill="#7c4740">∂L/∂b = (−4) × 1 = −4</text><rect x="90" y="419" width="1020" height="52" rx="9" fill="#eaf7f0" stroke="#a2d0bc" stroke-width="2"/><text x="600" y="452" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="790" fill="#157a62">SGD η=0.1  →  w′=1.8, b′=0.4  →  ŷ′=4, Loss′=0</text></svg>