<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-label="input 224x224x3 backbone four convolution stages 112 squared by 64 to 14 squared by 256 and alternative classification detection segmentation heads"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31859a"/></marker></defs><rect width="1200" height="475" fill="white"/><text x="48" y="40" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="760" fill="#123f5a">Backbone은 공통 특징을 계산하고, Head는 필요한 출력으로 바꿉니다</text><rect x="26" y="64" width="1148" height="348" rx="11" fill="#fafcfd" stroke="#dae7ec" stroke-width="2"/><rect x="52" y="167" width="170" height="107" rx="11" fill="#fff" stroke="#adc9d5" stroke-width="2"/><text x="137" y="210" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="720" fill="#2b5e75">입력 이미지</text><text x="137" y="244" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#5c7787">224×224×3</text><path d="M225 220L267 220" stroke="#31859a" stroke-width="3.3" marker-end="url(#arr)" fill="none"/><rect x="274" y="99" width="448" height="258" rx="11" fill="#edf5f8" stroke="#a8cbd8" stroke-width="2"/><text x="498" y="133" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" font-weight="780" fill="#19617e">Backbone  |  특징 추출</text><rect x="296" y="180" width="89" height="113" rx="7" fill="#fff" stroke="#add0df" stroke-width="2"/><text x="341" y="219" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" font-weight="750" fill="#27657c">Conv 1</text><text x="341" y="253" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="630" fill="#4f758a">112²×64</text><path d="M387 236L398 236" stroke="#31859a" stroke-width="3.3" marker-end="url(#arr)" fill="none"/><rect x="401" y="190" width="89" height="113" rx="7" fill="#fff" stroke="#add0df" stroke-width="2"/><text x="446" y="229" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" font-weight="750" fill="#27657c">Conv 2</text><text x="446" y="263" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="630" fill="#4f758a">56²×128</text><path d="M492 246L503 246" stroke="#31859a" stroke-width="3.3" marker-end="url(#arr)" fill="none"/><rect x="506" y="200" width="89" height="113" rx="7" fill="#fff" stroke="#add0df" stroke-width="2"/><text x="551" y="239" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" font-weight="750" fill="#27657c">Conv 3</text><text x="551" y="273" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="630" fill="#4f758a">28²×192</text><path d="M597 256L608 256" stroke="#31859a" stroke-width="3.3" marker-end="url(#arr)" fill="none"/><rect x="611" y="210" width="89" height="113" rx="7" fill="#fff" stroke="#add0df" stroke-width="2"/><text x="656" y="249" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" font-weight="750" fill="#27657c">Conv 4</text><text x="656" y="283" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="630" fill="#4f758a">14²×256</text><text x="499" y="333" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" font-weight="580" fill="#527689">가로·세로는 감소 / Feature Channel 수는 증가</text><path d="M722 225L781 225" stroke="#31859a" stroke-width="3.3" marker-end="url(#arr)" fill="none"/><rect x="795" y="87" width="349" height="94" rx="9" fill="#e7f3f9" stroke="#2c718e" stroke-width="2"/><text x="881" y="124" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="740" fill="#2c718e">분류 Head</text><text x="1021" y="154" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="720" fill="#284d62">Class score</text><rect x="795" y="194" width="349" height="94" rx="9" fill="#e9f7ef" stroke="#147a68" stroke-width="2"/><text x="881" y="231" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="740" fill="#147a68">검출 Head</text><text x="1021" y="261" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="720" fill="#284d62">Class + Box</text><rect x="795" y="301" width="349" height="94" rx="9" fill="#fff1e9" stroke="#a45e3d" stroke-width="2"/><text x="881" y="338" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="740" fill="#a45e3d">분할 Head</text><text x="1021" y="368" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="720" fill="#284d62">Pixel Mask</text><rect x="142" y="424" width="915" height="43" rx="8" fill="#e8f5ef" stroke="#b1d9c9" stroke-width="2"/><text x="601" y="452" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" font-weight="720" fill="#167363">세 Head는 서로 다른 Task의 선택 예시이며, 한 모델이 항상 모두 출력하지는 않습니다.</text></svg>