<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Conv는 패턴을 계산하고, BN은 값을 조정하며, ReLU는 비선형성을 만듭니다." ><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7993a4"/></marker></defs><rect width="1200" height="500" fill="#fff"/><text x="600" y="61" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="31" font-weight="750" fill="#24465c">자주 사용되는 CNN 블록: Conv → BN → ReLU</text><rect x="62" y="126" width="295" height="233" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="62" y="126" width="295" height="10" rx="6" fill="#477bb7" stroke="#477bb7" stroke-width="2"/><text x="209.5" y="176" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Convolution</text><text x="209.5" y="219" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">3×3 Kernel</text><text x="209.5" y="250" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">공간 패턴에 반응</text><text x="209.5" y="281" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">출력 Channel 생성</text><rect x="452" y="126" width="295" height="233" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="452" y="126" width="295" height="10" rx="6" fill="#8472ba" stroke="#8472ba" stroke-width="2"/><text x="599.5" y="176" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">BatchNorm</text><text x="599.5" y="219" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">Batch Normalization</text><text x="599.5" y="250" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">값의 분포를 조정</text><text x="599.5" y="281" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">γ·β는 학습 파라미터</text><rect x="842" y="126" width="295" height="233" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="842" y="126" width="295" height="10" rx="6" fill="#2b8a79" stroke="#2b8a79" stroke-width="2"/><text x="989.5" y="176" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">ReLU</text><text x="989.5" y="219" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">max(0, x)</text><text x="989.5" y="250" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">음수는 0, 양수는 유지</text><text x="989.5" y="281" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">비선형성 부여</text><path d="M359 243 L447 243" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M749 243 L837 243" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="453" width="1156" height="36" rx="7" fill="#f3f8fa"/><text x="600" y="479" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="550" fill="#24465c">Conv는 패턴을 계산하고, BN은 값을 조정하며, ReLU는 비선형성을 만듭니다.</text></svg>