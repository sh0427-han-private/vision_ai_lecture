<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Freeze weights or fine-tune them?"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769ba5"/></marker></defs><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="18" font-weight="700" fill="#338493">DATA AND TRANSFER LEARNING / 44</text><text x="54" y="93" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="35" font-weight="700" fill="#28495b">Freeze weights or fine-tune them?</text><path d="M54 113H1386" stroke="#e1eaf0" stroke-width="2"/><rect x="54" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="75" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Frozen backbone</text><text x="75" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Only train the task head</text><rect x="104" y="252" width="307" height="58" rx="7" fill="#e5ecf0" stroke="#bfd0db" stroke-width="1.7"/><text x="123" y="289" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#28495b">Backbone: fixed weights</text><rect x="104" y="326" width="307" height="60" rx="7" fill="#dff2e8" stroke="#bfdccd" stroke-width="1.7"/><text x="123" y="363" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#28495b">Head: trainable</text><rect x="510" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="531" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Fine-tune backbone</text><text x="531" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Update some or all layers</text><rect x="561" y="252" width="307" height="58" rx="7" fill="#dff2e8" stroke="#bfdccd" stroke-width="1.7"/><text x="578" y="289" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#28495b">Backbone: trainable</text><rect x="561" y="326" width="307" height="60" rx="7" fill="#dff2e8" stroke="#bfdccd" stroke-width="1.7"/><text x="580" y="363" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#28495b">Head: trainable</text><rect x="966" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="987" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Trade-offs</text><text x="987" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Accuracy / data / compute</text><text x="1005" y="273" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#28495b">Frozen:</text><text x="1005" y="311" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="500" fill="#28495b">faster, less adaptation</text><text x="1005" y="365" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#28495b">Fine-tune:</text><text x="1005" y="403" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="500" fill="#28495b">flexible, more tuning risk</text><rect x="54" y="516" width="1332" height="60" rx="10" fill="#f0f7f8" stroke="#d8e7ea" stroke-width="1.7"/><text x="78" y="551" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Choose an approach based on available data, domain shift, compute and validation results.</text></svg>