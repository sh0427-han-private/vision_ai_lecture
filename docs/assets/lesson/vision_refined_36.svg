<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Mini-batch, iteration and epoch"><defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7597a5"/></marker></defs><rect width="1440" height="610" fill="white"/><text x="54" y="50" text-anchor="start" font-size="18" font-weight="800" fill="#2c8292" font-family="Arial,Helvetica,sans-serif">TRAINING MECHANICS / 36</text><text x="54" y="93" text-anchor="start" font-size="35" font-weight="800" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Mini-batch, iteration and epoch</text><path d="M54 114H1386" stroke="#dfeaf0" stroke-width="2"/><rect x="54" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="76" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Dataset</text><text x="76" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">10 input images</text><text x="92" y="284" text-anchor="start" font-size="34" font-weight="700" fill="#4ca4a0" font-family="Arial,Helvetica,sans-serif">● ● ● ● ●</text><text x="92" y="338" text-anchor="start" font-size="34" font-weight="700" fill="#4ca4a0" font-family="Arial,Helvetica,sans-serif">● ● ● ● ●</text><text x="91" y="432" text-anchor="start" font-size="21" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Dataset size = 10</text><rect x="510" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="532" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Mini-batches</text><text x="532" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Batch size = 4</text><rect x="559" y="241" width="31