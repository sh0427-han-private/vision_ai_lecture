f9" stroke="#b8d6e0" stroke-width="2"/><text x="539.5" y="133" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#347c96">Conv 2</text><text x="539.5" y="185" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="740" fill="#214d64">56×56×128</text><path data-arrow-shape="solid" data-arrow-x1="637" data-arrow-y1="169" data-arrow-x2="652" data-arrow-y2="169" d="M637 170.37 L646.15 170.37 L646.15 175.3 L652 169 L646.15 162.7 L646.15 167.63 L637 167.63 Z" fill="#31859a"/><rect x="660" y="87" width="179" height="157" rx="10" fill="#eef7f9" stroke="#b8d6e0" stroke-width="2"/><text x="749.5" y="133" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#347c96">Conv 3</text><text x="749.5" y="185" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="740" fill="#214d64">28×28×192</text><path data-arrow-shape="solid" data-arrow-x1="847" data-arrow-y1="169" data-arrow-x2="862" data-arrow-y2="169" d="M847 170.37 L856.15 170.37 L856.15 175.3 L862 169 L856.15 162.7 L856.15 167.63 L847 167.63 Z" fill="#31859a"/><rect x="870" y="87" width="277" height="157" rx="10" fill="#eef7f9" stroke="#b8d6e0" stroke-width="2"/><text x="1008.5" y="133" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#347c96">Conv 4</text><text x="1008.5" y="185" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" font-weight="740" fill="#214d64">14×14×256</text><rect x="44" y="272" width="1112" height="122" rx="10" fill="#f7fafc" stroke="#d9e7ee" stroke-width="2"/><text x="243" y="310" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="760" fill="#287390">분류</text><text x="243" y="354" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="620" fill="#4e6c7e">Pooling → Class logits</text><text x="595" y="310" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="760" fill="#18836c">검출</text><text x="595" y="354" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="620" fill="#4e6c7e">Neck/Head → Box·Score</text><text x="958" y="310" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="760" fill="#b36c48">분할</text><text x="958" y="354" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="620" fill="#4e6c7e">Decoder/Head → Pixel Mask</text><path d="M416 294V376M779 294V376" fill="none" stroke="#d2e1e7" stroke-width="2"/><rect x="177" y="415" width="838" height="47" rx="8" fill="#e7f5ef" stroke="#b6d9cb" stroke-width="2"/><text x="600" y="446" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" font-weight="695" fill="#167362">공간 Shape와 Head 연결은 교육용 예시입니다. 실제 모델의 구성은 달라집니다.</text></svg>