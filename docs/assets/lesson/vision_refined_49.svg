<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Intersection over Union measures box overlap"><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e8194">MODEL EVALUATION / 49</text><text x="54" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#254658">Intersection over Union measures box overlap</text><path d="M54 114L1386 114" fill="none" stroke="#e0ecf0" stroke-width="2"/><rect x="54" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="76" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Ground-truth box</text><text x="76" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">100 × 100 example</text><rect x="169" y="250" width="140" height="140" rx="0" fill="#e5f5ec" stroke="#61aa8f" stroke-width="1.7"/><text x="93" y="444" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#254658">Area = 10,000</text><rect x="510" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="532" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Predicted box</text><text x="532" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Shifted right by 50</text><rect x="596" y="249" width="139" height="139" rx="0" fill="#e5f5ec" stroke="#69ae91" stroke-width="1.7"/><rect x="666" y="249" width="139" height="139" rx="0" fill="#fae4c6" fill-opacity=".48" stroke="#dfac60" stroke-width="1.7"/><rect x="666" y="249" width="69" height="139" rx="0" fill="#bad9ce" stroke="#