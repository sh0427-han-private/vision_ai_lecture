    <rect x="40" y="85" width="260" height="58" rx="10" fill="#f1f5f9"/><text x="170" y="121" text-anchor="middle" font-size="18" fill="#334155">Train + Val + Test</text>
    <path data-arrow-shape="solid" data-arrow-x1="170" data-arrow-y1="150" data-arrow-x2="170" data-arrow-y2="192" d="M168.15 150 L168.15 182 L163.3 182 L170 192 L176.7 182 L171.85 182 L171.85 150 Z" fill="#e11d48"/>
