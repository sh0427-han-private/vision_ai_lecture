<path d="M54 113H1386" stroke="#e2ebef" stroke-width="2"/><rect x="54" y="143" width="420" height="336" rx="12" fill="#fff" stroke="#ccdde5" stroke-width="2"/><text x="78" y="180" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#294a5d">Prediction A</text><text x="78" y="211" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#648090">Same target y = 4</text><rect x="110" y="252" width="308" height="72" rx="12" fill="#f9eee9" stroke="#ccdde5" stroke-width="2"/><text x="142" y="299" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#254a5c">ŷ = 2.0</text><text x="96" y="359" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#294a5d">Error = 4 − 2.0 = 2.0</text><text x="96" y="406" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#a16d60">Squared error = 4.00</text><text x="96" y="448" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#294a5d">Large mismatch</text><rect x="510" y="143" width="420" height="336" rx="12" fill="#fff" stroke="#ccdde5" stroke-width="2"/><text x="534" y="180" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#294a5d">Prediction B</text><text x="534" y="211" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#648090">Same target y = 4</text><rect x="566" y="252" width="308" height="72" rx="12" fill="#f1f6e9" stroke="#ccdde5" stroke-width="2"/><text x="598" y="299" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#254a5c">ŷ = 3.6</text><text x="552" y="359" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#294a5d">Error = 4 − 3.6 = 0.4</text><text x="552" y="406" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#a16d60">Squared error = 0.16</text><text x="552" y="448" font-family="Arial,Helvetica,sans-serif" font-si