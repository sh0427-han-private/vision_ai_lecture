<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Loss turns prediction error into a signal"><defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7597a5"/></marker></defs><rect width="1440" height="610" fill="white"/><text x="54" y="50" text-anchor="start" font-size="18" font-weight="800" fill="#2c8292" font-family="Arial,Helvetica,sans-serif">TRAINING MECHANICS / 33</text><text x="54" y="93" text-anchor="start" font-size="35" font-weight="800" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Loss turns prediction error into a signal</text><path d="M54 114H1386" stroke="#dfeaf0" stroke-width="2"/><rect x="54" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="76" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Ground truth</text><text x="76" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">What the correct label says</text><rect x="125" y="256" width="261" height="106" rx="12" fill="#eaf4ef" stroke="#c6ded2" stroke-width="1.8"/><text x="153" y="306" text-anchor="start" font-size="24" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Correct class</text><text x="156" y="347" text-anchor="start" font-size="28" font-weight="800" fill="#2c8677" font-family="Arial,Helvetica,sans-serif">apple</text><rect x="510" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="532" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Model prediction</text><text x="532" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">What the model currently says</text><rect x="569" y="256" width="301" height="106" rx="12" fill="#edf4f7" stroke="#cedee6" stroke-width="1.8"/><text x="595" y="302" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Predicted score</text><text x="595" y="346" text-anchor="start" font-size="28" font-weight="800" fill="#ac6871" font-family="Arial,Helvetica,sans-serif">apple = 0.20</text><rect x="966" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="988" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Loss</text><text x="988" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Mismatch drives learning</text><text x="1004" y="282" text-anchor="start" font-size="22" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Prediction ≠ ground truth</text><text x="1004" y="335" text-anchor="start" font-size="21" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Loss is a training objective</text><text x="1004" y="384" text-anchor="start" font-size="19" font-weight="500" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Backpropagation updates</text><text x="1004" y="410" text-anchor="start" font-size="19" font-weight="500" fill="#28495a" font-family="Arial,Helvetica,sans-serif">trainable parameters</text><rect x="54" y="516" width="1332" height="60" rx="10" fill="#eff7f8" stroke="#d4e3e8" stroke-width="1.8"/><text x="77" y="551" text-anchor="start" font-size="19" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">A detector can combine box, class and other losses; this is a conceptual example.</text></svg>