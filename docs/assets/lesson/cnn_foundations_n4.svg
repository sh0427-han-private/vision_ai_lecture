<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="ResNet의 Skip Connection은 입력 특징을 다음 블록으로 직접 전달하는 우회 경로입니다." ><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7993a4"/></marker></defs><rect width="1200" height="500" fill="#fff"/><text x="600" y="64" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="29" font-weight="750" fill="#24465c">Residual Connection: 원래 특징 x를 결과에 더합니다</text><rect x="38" y="195" width="170" height="136" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="38" y="195" width="170" height="10" rx="6" fill="#2b8a79" stroke="#2b8a79" stroke-width="2"/><text x="123" y="245" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Input x</text><text x="123" y="288" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">H × W × C</text><rect x="300" y="155" width="210" height="145" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="300" y="155" width="210" height="10" rx="6" fill="#477bb7" stroke="#477bb7" stroke-width="2"/><text x="405" y="205" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Conv + BN</text><text x="405" y="248" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">3×3 Filter</text><rect x="581" y="155" width="210" height="145" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="581" y="155" width="210" height="10" rx="6" fill="#477bb7" stroke="#477bb7" stroke-width="2"/><text x="686" y="205" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Conv + BN</text><text x="686" y="248" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">특징 변환 F(x)</text><rect x="915" y="187" width="212" height="145" rx="12" fill="#ecf7f4" stroke="#2b8a79" stroke-width="2"/><text x="1020" y="238" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="750" fill="#24465c">Add + ReLU</text><text x="1020" y="280" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#2b8a79">F(x) + x</text><path d="M211 245 L295 245" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M513 227 L576 227" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M795 227 L911 227" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M208 282 V389 H1018 V335" fill="none" stroke="#c18a44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="600" y="420" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">Skip path: 형태가 같으면 x를 직접 더하고, 다르면 1×1 Projection으로 맞춥니다</text><rect x="22" y="453" width="1156" height="36" rx="7" fill="#f3f8fa"/><text x="600" y="479" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="550" fill="#24465c">ResNet의 Skip Connection은 입력 특징을 다음 블록으로 직접 전달하는 우회 경로입니다.</text></svg>