<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Flatten(7×7×64=3136)과 달리 GAP는 각 Channel을 1개의 평균값으로 요약합니다." ><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7993a4"/></marker></defs><rect width="1200" height="500" fill="#fff"/><text x="600" y="58" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="30" font-weight="750" fill="#24465c">Pool은 공간을 줄이고, GAP는 공간 전체를 요약합니다</text><rect x="40" y="90" width="537" height="324" rx="12" fill="#eff5fb" stroke="#bed4e4" stroke-width="2"/><text x="305" y="135" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="750" fill="#24465c">Local Max Pooling</text><rect x="70" y="170" width="202" height="150" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="70" y="170" width="202" height="10" rx="6" fill="#477bb7" stroke="#477bb7" stroke-width="2"/><text x="171" y="220" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">2 × 2</text><text x="171" y="263" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">[ 1, 7 ]</text><text x="171" y="294" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">[ 4, 2 ]</text><path d="M283 245 L337 245" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><rect x="348" y="170" width="200" height="150" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="348" y="170" width="200" height="10" rx="6" fill="#477bb7" stroke="#477bb7" stroke-width="2"/><text x="448" y="220" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Max = 7</text><text x="448" y="263" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">출력 한 위치</text><text x="448" y="294" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">큰 값만 유지</text><rect x="621" y="90" width="537" height="324" rx="12" fill="#ecf7f4" stroke="#b5dacf" stroke-width="2"/><text x="890" y="135" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="750" fill="#24465c">Global Average Pooling</text><rect x="642" y="170" width="218" height="150" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="642" y="170" width="218" height="10" rx="6" fill="#2b8a79" stroke="#2b8a79" stroke-width="2"/><text x="751" y="220" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">7 × 7 × 64</text><text x="751" y="263" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">각 Channel</text><text x="751" y="294" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">전체 위치 평균</text><path d="M864 245 L909 245" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><rect x="920" y="170" width="213" height="150" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="920" y="170" width="213" height="10" rx="6" fill="#2b8a79" stroke="#2b8a79" stroke-width="2"/><text x="1026.5" y="220" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">1 × 1 × 64</text><text x="1026.5" y="263" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">64개 특징</text><text x="1026.5" y="294" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">Dense Head 입력</text><rect x="22" y="453" width="1156" height="36" rx="7" fill="#f3f8fa"/><text x="600" y="479" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="550" fill="#24465c">Flatten(7×7×64=3136)과 달리 GAP는 각 Channel을 1개의 평균값으로 요약합니다.</text></svg>