<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-label="Mean Gaussian Median 같은 3x3 입력에서 서로 다른 결과 비교"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1a819c"/></marker></defs><rect width="1280" height="610" fill="#fff"/><text x="60" y="64" font-size="38" fill="#0c314e" font-weight="800" text-anchor="start">같은 노이즈도 필터에 따라 결과가 다릅니다</text><text x="60" y="105" font-size="23" fill="#5e7385" font-weight="450" text-anchor="start">중앙에 255가 포함된 동일한 3 × 3 입력으로 직접 계산합니다.</text><text x="202" y="177" font-size="26" fill="#1e4a62" font-weight="750" text-anchor="middle">입력 3 × 3</text><rect x="94" y="204" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="130" y="248" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">98</text><rect x="166" y="204" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="202" y="248" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">101</text><rect x="238" y="204" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="274" y="248" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">99</text><rect x="94" y="276" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="130" y="320" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">102</text><rect x="166" y="276" width="72" height="72" rx="0" fill="#fff0e8" stroke="#bdcfd7" stroke-width="1.3"/><text x="202" y="320" font-size="26.64" fill="#b93d2d" font-weight="700" text-anchor="middle">255</text><rect x="238" y="276" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="274" y="320" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">100</text><rect x="94" y="348" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="130" y="392" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">101</text><rect x="166" y="348" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="202" y="392" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">98</text><rect x="238" y="348" width="72" height="72" rx="0" fill="#f5f8fa" stroke="#bdcfd7" stroke-width="1.3"/><text x="274" y="392" font-size="26.64" fill="#233e50" font-weight="700" text-anchor="middle">99</text><line x1="340" y1="318" x2="425" y2="318" stroke="#1a819c" stroke-width="4" marker-end="url(#arrow)"/><rect x="438" y="175" width="235" height="345" rx="12" fill="#f8fafc" stroke="#cbdce3" stroke-width="2"/><rect x="438" y="175" width="235" height="58" rx="10" fill="#3d78ac" stroke="#3d78ac" stroke-width="2"/><text x="555" y="212" font-size="29" fill="white" font-weight="750" text-anchor="middle">Mean</text><text x="555" y="305" font-size="42" fill="#3d78ac" font-weight="800" text-anchor="middle">117.00</text><text x="555" y="378" font-size="20" fill="#2d5366" font-weight="550" text-anchor="middle">9개 값의 산술평균</text><text x="555" y="428" font-size="17" fill="#4f6a78" font-weight="550" text-anchor="middle">255의 영향을 받음</text><rect x="699" y="175" width="235" height="345" rx="12" fill="#f8fafc" stroke="#cbdce3" stroke-width="2"/><rect x="699" y="175" width="235" height="58" rx="10" fill="#1d9291" stroke="#1d9291" stroke-width="2"/><text x="816" y="212" font-size="29" fill="white" font-weight="750" text-anchor="middle">Gaussian</text><text x="816" y="305" font-size="42" fill="#1d9291" font-weight="800" text-anchor="middle">138.69</text><text x="816" y="378" font-size="20" fill="#2d5366" font-weight="550" text-anchor="middle">중앙 가중치가 더 큼</text><text x="816" y="428" font-size="17" fill="#4f6a78" font-weight="550" text-anchor="middle">중앙의 255가 더 강하게 반영</text><rect x="960" y="175" width="235" height="345" rx="12" fill="#f8fafc" stroke="#cbdce3" stroke-width="2"/><rect x="960" y="175" width="235" height="58" rx="10" fill="#8d679f" stroke="#8d679f" stroke-width="2"/><text x="1077" y="212" font-size="29" fill="white" font-weight="750" text-anchor="middle">Median</text><text x="1077" y="305" font-size="42" fill="#8d679f" font-weight="800" text-anchor="middle">100</text><text x="1077" y="378" font-size="20" fill="#2d5366" font-weight="550" text-anchor="middle">정렬한 값의 중앙</text><text x="1077" y="428" font-size="17" fill="#4f6a78" font-weight="550" text-anchor="middle">튀는 값 제거에 유리</text><rect x="165" y="547" width="956" height="48" rx="8" fill="#e8f5ef" stroke="#b8dbc9" stroke-width="2"/><text x="643" y="580" font-size="23" fill="#14745e" font-weight="700" text-anchor="middle">Median은 비선형 필터이며, Gaussian은 점 잡음에 항상 최선이 아닙니다.</text></svg>