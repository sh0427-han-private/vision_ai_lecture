<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-label="입력 x1 x2와 고정 입력 1에 각각 가중치와 편향을 곱해 합산하고 Step으로 판정하는 퍼셉트론"><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;font-size:22px;fill:#294e60}.small{font-size:19px;fill:#617887}.bold{font-weight:700}.green{fill:#137b66}.line{stroke:#8da8b5;stroke-width:2;fill:none}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8b5"/></marker></defs><rect width="1120" height="390" fill="white"/><text x="130" y="35" text-anchor="middle" class="">입력</text><text x="490" y="35" text-anchor="middle" class="">가중합</text><text x="800" y="35" text-anchor="middle" class="">계단형 활성화</text><text x="1040" y="35" text-anchor="middle" class="">출력</text><circle cx="130" cy="105" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="130" y="113" text-anchor="middle" class="bold">x₁</text><path d="M173 105L439 200" class="line" marker-end="url(#a)"/><text x="280" y="89" text-anchor="middle" class="bold">w₁ = 0.5</text><circle cx="130" cy="220" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="130" y="228" text-anchor="middle" class="bold">x₂</text><path d="M173 220L439 200" class="line" marker-end="url(#a)"/><text x="280" y="204" text-anchor="middle" class="bold">w₂ = 0.5</text><circle cx="130" cy="335" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="130" y="343" text-anchor="middle" class="bold">1</text><path d="M173 335L439 200" class="line" marker-end="url(#a)"/><text x="280" y="319" text-anchor="middle" class="bold">b = −0.7</text><circle cx="480" cy="200" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="480" y="208" text-anchor="middle" class="bold">Σ</text><path d="M524 200L665 200" class="line" marker-end="url(#a)"/><rect x="680" y="105" width="245" height="175" rx="5" fill="#f0f7f4" stroke="#8db9ab"/><text x="802" y="138" text-anchor="middle" class="bold">Step(z)</text><path d="M710 240H802V168H890" fill="none" stroke="#16866e" stroke-width="4"/><text x="740" y="265" text-anchor="middle" class="small">z &lt; 0：0</text><text x="850" y="195" text-anchor="middle" class="small">z ≥ 0：1</text><path d="M940 200L990 200" class="line" marker-end="url(#a)"/><circle cx="1040" cy="200" r="34" fill="#edf5f5" stroke="#7398a4" stroke-width="2"/><text x="1040" y="208" text-anchor="middle" class="bold">y</text><text x="515" y="300" text-anchor="middle" class="bold">z = w₁x₁ + w₂x₂ + b</text><text x="802" y="340" text-anchor="middle" class="bold green">y = Step(z)</text><text x="510" y="376" text-anchor="middle" class="small">예: (1,1) → 0.5 + 0.5 − 0.7 = 0.3 → 1</text></svg>