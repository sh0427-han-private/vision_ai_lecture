<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Training learns weights; inference uses them"><defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7597a5"/></marker></defs><rect width="1440" height="610" fill="white"/><text x="54" y="50" text-anchor="start" font-size="18" font-weight="800" fill="#2c8292" font-family="Arial,Helvetica,sans-serif">TRAINING MECHANICS / 35</text><text x="54" y="93" text-anchor="start" font-size="35" font-weight="800" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Training learns weights; inference uses them</text><path d="M54 114H1386" stroke="#dfeaf0" stroke-width="2"/><rect x="54" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="76" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Training data</text><text x="76" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Images WITH labels</text><rect x="170" y="248" width="54" height="54" rx="0" fill="#f1f8f6" stroke="#bbd4dc" stroke-width="1.8"/><text x="197" y="283.64" text-anchor="middle" font-size="21.060000000000002" font-weight="700" fill="#2e5367" font-family="Arial,Helvetica,sans-serif">0</text><rect x="224" y="248" width="54" height="54" rx="0" fill="#f1f8f6" stroke="#bbd4dc" stroke-width="1.8"/><text x="251" y="283.64" text-anchor="middle" font-size="21.060000000000002" font-weight="700" fill="#2e5367" font-family="Arial,Helvetica,sans-serif">1</text><rect x="278" y="248" width="54" height="54" rx="0" fill="#b1d9cf" stroke="#bbd4dc" stroke-width="1.8"/><text x="305" y="283.64" text-anchor="middle" font-size="21.060000000000002" font-weight="700" fill="#2e5367" font-family="Arial,Helvetica,sans-serif">2</text><rect x="170" y="302" width="54" height="54" rx="0" fill="#f1f8f6" stroke="#bbd4dc" stroke-width="1.8"/><text x="197" y="337.64" text-anchor="middle" font-size="21.060000000000002" font-weight="700" fill="#2e5367" font-family="Arial,Helvetica,sans-serif">1</text><rect x="224" y="302" width="54" height="54" rx="0" fill="#b1d9cf" stroke="#bbd4dc" stroke-width="1.8"/><text x="251" y="337.64" text-anchor="middle" font-size="21.060000000000002" font-weight="700" fill="#2e5367" font-family="Arial,Helvetica,sans-serif">2</text><rect x="278" y="302" width="54" height="54" rx="0" fill="#b1d9cf" stroke="#bbd4dc" stroke-width="1.8"/><text x="305" y="337.64" text-anchor="middle" font-size="21.060000000000002" font-weight="700" fill="#2e5367" font-family="Arial,Helvetica,sans-serif">3</text><text x="88" y="439" text-anchor="start" font-size="19" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Calculate loss against labels</text><rect x="510" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="532" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Training mode</text><text x="532" y="208" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c" font-family="Arial,Helvetica,sans-serif">Weights can change</text><rect x="582" y="264" width="279" height="108" rx="12" fill="#eaf5ef" stroke="#cbe3d5" stroke-width="1.8"/><text x="608" y="308" text-anchor="start" font-size="22" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Forward + gradients</text><text x="608" y="345" text-anchor="start" font-size="21" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Optimizer updates weights</text><rect x="966" y="140" width="420" height="339" rx="12" fill="#fff" stroke="#ccdfe6" stroke-width="1.8"/><text x="988" y="177" text-anchor="start" font-size="23" font-weight="700" fill="#28495a" font-family="Arial,Helvetica,sans-serif">Inference mode</text><text x="9