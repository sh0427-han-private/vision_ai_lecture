<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="활성화 함수가 없으면 두 affine layer y=6x+1로 합쳐짐 반면 중간 ReLU는 기울기 변화를 만듦"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#248398"/></marker></defs><rect width="1200" height="480" fill="#fff"/><text x="60" y="43" text-anchor="start" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="30" font-weight="780" fill="#12415b">Activation이 없으면 여러 Layer도 결국 직선 하나입니다</text><rect x="24" y="75" width="555" height="315" rx="12" fill="#fafcfd" stroke="#cfdee4" stroke-width="2"/><rect x="607" y="75" width="569" height="315" rx="12" fill="#fafcfd" stroke="#cfdee4" stroke-width="2"/><text x="298" y="120" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="750" fill="#1a657d">Activation 없음</text><text x="888" y="120" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="750" fill="#197e6e">중간에 ReLU 적용</text><rect x="59" y="166" width="143" height="103" rx="9" fill="#fff" stroke="#c3dbe5" stroke-width="2"/><text x="130" y="196" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#56798c">Linear 1</text><text x="130" y="232" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="730" fill="#245b77">h = 2x+1</text><line x1="211" y1="220" x2="221" y2="220" stroke="#248398" stroke-width="2.6" marker-end="url(#a)"/><rect x="230" y="166" width="143" height="103" rx="9" fill="#fff" stroke="#c3dbe5" stroke-width="2"/><text x="301" y="196" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#56798c">Linear 2</text><text x="301" y="232" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="730" fill="#245b77">y = 3h−2</text><line x1="382" y1="220" x2="392" y2="220" stroke="#248398" stroke-width="2.6" marker-end="url(#a)"/><rect x="401" y="166" width="143" height="103" rx="9" fill="#e6f2f6" stroke="#c3dbe5" stroke-width="2"/><text x="472" y="196" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#56798c">합치면</text><text x="472" y="232" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="730" fill="#245b77">y = 6x+1</text><text x="298" y="326" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="22" font-weight="650" fill="#597787">기울기가 일정 → 1개의 Affine 계산</text><rect x="642" y="166" width="144" height="103" rx="9" fill="#fff" stroke="#c3dbe5" stroke-width="2"/><text x="714" y="195" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#56798c">Linear 1</text><text x="714" y="232" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="730" fill="#245b77">2x+1</text><line x1="795" y1="220" x2="807" y2="220" stroke="#248398" stroke-width="2.6" marker-end="url(#a)"/><rect x="816" y="166" width="144" height="103" rx="9" fill="#e4f4ed" stroke="#94cdbb" stroke-width="2"/><text x="888" y="195" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#188575">ReLU</text><text x="888" y="232" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="730" fill="#245b77">max(0,h)</text><line x1="969" y1="220" x2="981" y2="220" stroke="#248398" stroke-width="2.6" marker-end="url(#a)"/><rect x="990" y="166" width="144" height="103" rx="9" fill="#fff" stroke="#c3dbe5" stroke-width="2"/><text x="1062" y="195" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="650" fill="#56798c">Linear 2</text><text x="1062" y="232" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="730" fill="#245b77">3h−2</text><text x="890" y="326" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="650" fill="#367b71">x = −1 → y = −2 · x = 0 → y = 1</text><rect x="258" y="409" width="687" height="50" rx="8" fill="#eaf6f1" stroke="#b4d9c8" stroke-width="2"/><text x="603" y="441" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="24" font-weight="730" fill="#147568">ReLU를 지나면 x=−0.5에서 기울기가 꺾입니다.</text></svg>