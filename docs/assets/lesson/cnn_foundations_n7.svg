<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Encoder는 문맥을 요약하고 Decoder는 공간 해상도를 복원하여 Mask를 출력합니다." ><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7993a4"/></marker></defs><rect width="1200" height="500" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="30" font-weight="750" fill="#24465c">U-Net: 작게 압축한 특징을 다시 크게 복원</text><rect x="30" y="156" width="218" height="164" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="30" y="156" width="218" height="10" rx="6" fill="#477bb7" stroke="#477bb7" stroke-width="2"/><text x="139" y="206" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Encoder</text><text x="139" y="249" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">256×256×3</text><text x="139" y="280" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">→ 128×128×32</text><rect x="300" y="224" width="230" height="164" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="300" y="224" width="230" height="10" rx="6" fill="#8472ba" stroke="#8472ba" stroke-width="2"/><text x="415" y="274" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Bottleneck</text><text x="415" y="317" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">64×64×64</text><text x="415" y="348" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">더 넓은 문맥</text><rect x="586" y="156" width="223" height="164" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="586" y="156" width="223" height="10" rx="6" fill="#2b8a79" stroke="#2b8a79" stroke-width="2"/><text x="697.5" y="206" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Decoder</text><text x="697.5" y="249" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">Upsampling</text><text x="697.5" y="280" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">→ 128×128×32</text><rect x="864" y="156" width="297" height="164" rx="12" fill="#fff" stroke="#d2e1e7" stroke-width="2"/><rect x="864" y="156" width="297" height="10" rx="6" fill="#2b8a79" stroke="#2b8a79" stroke-width="2"/><text x="1012.5" y="206" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="750" fill="#24465c">Segmentation Head</text><text x="1012.5" y="249" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#24465c">→ 256×256×K</text><text x="1012.5" y="280" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" font-weight="550" fill="#527185">Pixel별 Class/Mask</text><path d="M251 270 L296 293" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M533 293 L582 265" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M813 237 L861 237" fill="none" stroke="#9db9c8" stroke-width="3" marker-end="url(#arr)"/><path d="M246 195 V105 H696 V151" fill="none" stroke="#c18a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="470" y="97" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="550" fill="#c18a44">Skip: 초반의 위치·경계 정보 전달</text><rect x="22" y="453" width="1156" height="36" rx="7" fill="#f3f8fa"/><text x="600" y="479" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="550" fill="#24465c">Encoder는 문맥을 요약하고 Decoder는 공간 해상도를 복원하여 Mask를 출력합니다.</text></svg>