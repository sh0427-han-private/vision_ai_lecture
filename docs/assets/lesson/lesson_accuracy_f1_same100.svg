<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-label="Accuracy (18+76)/100=94 percent F1 36/42=85.7 percent same TP18 FN2 FP4 TN76"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24839a"/></marker></defs><rect width="1200" height="475" fill="white"/><text x="48" y="44" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#153f59" font-weight="745">한 모델을 같은 100건으로 평가해도, 지표는 서로 다른 질문을 합니다</text><rect x="25" y="76" width="557" height="335" rx="12" fill="#f8fbfc" stroke="#d8e7ed" stroke-width="2"/><rect x="612" y="76" width="565" height="335" rx="12" fill="#f8fbfc" stroke="#d8e7ed" stroke-width="2"/><text x="304" y="122" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#1e637f" font-weight="770">Accuracy  |  전체 정답률</text><text x="304" y="174" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#396a7e" font-weight="680">맞춘 건수 = TP 18 + TN 76</text><rect x="81" y="207" width="449" height="49" rx="6" fill="#e7ebee" stroke="#c9d8df" stroke-width="2"/><rect x="83" y="209" width="419.06" height="45" rx="4" fill="#2c9c7a"/><rect x="503.06" y="209" width="24.939999999999998" height="45" rx="2" fill="#df956c"/><text x="303" y="302" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="34" fill="#1b7385" font-weight="800">94 / 100 = 94.0%</text><text x="303" y="350" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#60798a" font-weight="560">전체 100개에서 오류는 6개</text><text x="893" y="122" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#1c766a" font-weight="760">F1  |  Precision·Recall 조화평균</text><text x="892" y="178" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#2c6471" font-weight="750">2×TP / (2×TP + FP + FN)</text><rect x="675" y="206" width="439" height="81" rx="10" fill="#fff" stroke="#c4e0d5" stroke-width="2"/><text x="894" y="238" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#356773" font-weight="740">36 / (36 + 4 + 2)</text><text x="894" y="271" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#187c66" font-weight="800">= 36 / 42 = 85.7%</text><text x="895" y="347" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" fill="#638173" font-weight="560">불량을 놓치거나 잘못 알리면 감소</text><rect x="159" y="423" width="882" height="40" rx="8" fill="#e9f6f0" stroke="#b5ddca" stroke-width="2"/><text x="600" y="450" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#187360" font-weight="730">Accuracy 94%만으로 불량 판정 성능을 판단하지 않습니다.</text></svg>