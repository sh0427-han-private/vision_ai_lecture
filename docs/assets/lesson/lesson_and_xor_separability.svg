<svg data-check-point-labels="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="AND와 XOR의 0부터 2까지 좌표축 비교. 실제 입력은 0 또는 1이며, AND는 x1 더하기 x2가 1.5인 직선이 세 개의 0과 한 개의 1을 구분합니다. XOR는 직선 하나로 분리할 수 없습니다."><rect width="1200" height="460" fill="white"/><text x="57" y="41" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="750" fill="#194562" text-anchor="start">AND는 직선 하나로 구분, XOR는 구분 불가</text><text x="1150" y="41" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="600" fill="#71899a" text-anchor="end">축 0–2는 시각화용 · 점은 0/1 입력</text><rect x="32" y="72" width="540" height="323" rx="10" fill="#f8fafc" stroke="#cbdce6" stroke-width="2"/><rect x="622" y="72" width="546" height="323" rx="10" fill="#f8fafc" stroke="#cbdce6" stroke-width="2"/><text x="302" y="109" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#1f6c87" text-anchor="middle">AND · 둘 다 1일 때만 1</text><text x="895" y="109" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" font-weight="750" fill="#775c99" text-anchor="middle">XOR · 서로 다르면 1</text><g data-plot="and" data-x-min="0" data-x-max="2" data-y-min="0" data-y-max="2"><path d="M175 204 L325 354 H375 V154 H175 Z" fill="#deefe9" opacity=".95"/><path d="M175 204 L325 354 H175 Z" fill="#eaf0f5" opacity=".96"/><path d="M175 154 V354 H375" fill="none" stroke="#7897a9" stroke-width="3"/><path d="M175 349 V359" fill="none" stroke="#8faab8" stroke-width="2"/><path d="M170 354 H180" fill="none" stroke="#8faab8" stroke-width="2"/><text x="175" y="390" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">0</text><text x="138" y="361" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">0</text><path d="M275 349 V359" fill="none" stroke="#8faab8" stroke-width="2"/><path d="M170 254 H180" fill="none" stroke="#8faab8" stroke-width="2"/><text x="275" y="390" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">1</text><text x="138" y="261" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">1</text><path d="M375 349 V359" fill="none" stroke="#8faab8" stroke-width="2"/><path d="M170 154 H180" fill="none" stroke="#8faab8" stroke-width="2"/><text x="375" y="390" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">2</text><text x="138" y="161" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">2</text><text x="398" y="361" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#526e7e" text-anchor="middle">x₁</text><text x="106" y="238" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#526e7e" text-anchor="middle">x₂</text><path data-decision-boundary="and" data-equation="x1+x2=1.5" d="M175 204 L325 354" fill="none" stroke="#fbe1d0" stroke-width="18" stroke-linecap="round"/><path data-decision-boundary-main="and" d="M175 204 L325 354" fill="none" stroke="#d2652f" stroke-width="7" stroke-linecap="round"/><circle data-gate="and" data-x="0" data-y="0" data-class="0" cx="175" cy="354" r="13" fill="#ffffff" stroke="#32667c" stroke-width="3"/><circle data-gate="and" data-x="0" data-y="1" data-class="0" cx="175" cy="254" r="13" fill="#ffffff" stroke="#32667c" stroke-width="3"/><circle data-gate="and" data-x="1" data-y="0" data-class="0" cx="275" cy="354" r="13" fill="#ffffff" stroke="#32667c" stroke-width="3"/><circle data-gate="and" data-x="1" data-y="1" data-class="1" cx="275" cy="254" r="13" fill="#267f9b" stroke="#32667c" stroke-width="3"/></g><text x="466" y="179" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="800" fill="#be592b" text-anchor="middle">결정 경계</text><text x="466" y="211" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="730" fill="#be592b" text-anchor="middle">x₁ + x₂ = 1.5</text><rect x="411" y="243" width="18" height="18" rx="2" fill="#deefe9" stroke="#9bcdbd" stroke-width="2"/><text x="443" y="258" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" font-weight="740" fill="#246f70" text-anchor="start">1 영역</text><rect x="411" y="286" width="18" height="18" rx="2" fill="#eaf0f5" stroke="#bfcfdc" stroke-width="2"/><text x="443" y="301" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" font-weight="740" fill="#536c7d" text-anchor="start">0 영역</text><g data-plot="xor" data-x-min="0" data-x-max="2" data-y-min="0" data-y-max="2"><rect x="765" y="154" width="200" height="200" fill="#f7fafc"/><path d="M765 154 V354 H965" fill="none" stroke="#7897a9" stroke-width="3"/><path d="M765 349 V359" fill="none" stroke="#8faab8" stroke-width="2"/><path d="M760 354 H770" fill="none" stroke="#8faab8" stroke-width="2"/><text x="765" y="390" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">0</text><text x="728" y="361" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">0</text><path d="M865 349 V359" fill="none" stroke="#8faab8" stroke-width="2"/><path d="M760 254 H770" fill="none" stroke="#8faab8" stroke-width="2"/><text x="865" y="390" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">1</text><text x="728" y="261" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">1</text><path d="M965 349 V359" fill="none" stroke="#8faab8" stroke-width="2"/><path d="M760 154 H770" fill="none" stroke="#8faab8" stroke-width="2"/><text x="965" y="390" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">2</text><text x="728" y="161" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="650" fill="#526e7e" text-anchor="middle">2</text><text x="988" y="361" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#526e7e" text-anchor="middle">x₁</text><text x="696" y="238" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#526e7e" text-anchor="middle">x₂</text><circle data-gate="xor" data-x="0" data-y="0" data-class="0" cx="765" cy="354" r="13" fill="#ffffff" stroke="#32667c" stroke-width="3"/><circle data-gate="xor" data-x="0" data-y="1" data-class="1" cx="765" cy="254" r="13" fill="#267f9b" stroke="#32667c" stroke-width="3"/><circle data-gate="xor" data-x="1" data-y="0" data-class="1" cx="865" cy="354" r="13" fill="#267f9b" stroke="#32667c" stroke-width="3"/><circle data-gate="xor" data-x="1" data-y="1" data-class="0" cx="865" cy="254" r="13" fill="#ffffff" stroke="#32667c" stroke-width="3"/></g><text x="1060" y="197" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="720" fill="#9a5b68" text-anchor="middle">대각선에</text><text x="1060" y="227" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="720" fill="#9a5b68" text-anchor="middle">1과 0이 섞여</text><text x="1060" y="257" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="720" fill="#9a5b68" text-anchor="middle">직선 하나로는</text><text x="1060" y="287" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="760" fill="#9a5b68" text-anchor="middle">구분 불가</text><rect x="118" y="411" width="964" height="42" rx="10" fill="#ebf6f1" stroke="#b4d7ca" stroke-width="2"/><text x="600" y="439" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" font-weight="710" fill="#167761" text-anchor="middle">● 파랑 = 출력 1    ○ 흰색 = 출력 0          AND는 직선 가능 · XOR는 직선 하나로 불가능</text></svg>
