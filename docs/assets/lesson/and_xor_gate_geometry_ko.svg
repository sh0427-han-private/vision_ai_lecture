<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-label="AND와 XOR의 같은 네 입력 좌표, AND 경계 x1+x2=1.4, XOR는 한 직선으로 분리 불가능"><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;font-size:22px;fill:#294e60}.small{font-size:19px;fill:#617887}.bold{font-weight:700}.green{fill:#137b66}.line{stroke:#8da8b5;stroke-width:2;fill:none}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8b5"/></marker></defs><rect width="1120" height="390" fill="white"/><text x="280" y="30" text-anchor="middle" class="bold">AND Gate</text><path d="M120 315L390 315" class="line" marker-end="url(#a)"/><path d="M140 330L140 65" class="line" marker-end="url(#a)"/><text x="410" y="323" text-anchor="middle" class="">x₁</text><text x="140" y="48" text-anchor="middle" class="">x₂</text><text x="140" y="347" text-anchor="middle" class="small">0</text><text x="258" y="347" text-anchor="middle" class="small">1</text><text x="114" y="204" text-anchor="middle" class="small">1</text><text x="376" y="347" text-anchor="middle" class="small">2</text><text x="114" y="86" text-anchor="middle" class="small">2</text><path d="M140 149.8L305.2 315" stroke="#b77c49" stroke-width="3" stroke-dasharray="8 5"/><text x="350" y="110" text-anchor="middle" class="small">x₁+x₂ = 1.4</text><circle cx="140" cy="315" r="18" fill="#dce5e9"/><text x="140" y="322" text-anchor="middle" style="fill:#294e60;font-size:21px;font-weight:700">0</text><circle cx="140" cy="197" r="18" fill="#dce5e9"/><text x="140" y="204" text-anchor="middle" style="fill:#294e60;font-size:21px;font-weight:700">0</text><circle cx="258" cy="315" r="18" fill="#dce5e9"/><text x="258" y="322" text-anchor="middle" style="fill:#294e60;font-size:21px;font-weight:700">0</text><circle cx="258" cy="197" r="18" fill="#15856e"/><text x="258" y="204" text-anchor="middle" style="fill:white;font-size:21px;font-weight:700">1</text><text x="290" y="380" text-anchor="middle" class="bold green">두 입력이 모두 1일 때만 1</text><text x="840" y="30" text-anchor="middle" class="bold">XOR Gate</text><path d="M680 315L950 315" class="line" marker-end="url(#a)"/><path d="M700 330L700 65" class="line" marker-end="url(#a)"/><text x="970" y="323" text-anchor="middle" class="">x₁</text><text x="700" y="48" text-anchor="middle" class="">x₂</text><text x="700" y="347" text-anchor="middle" class="small">0</text><text x="818" y="347" text-anchor="middle" class="small">1</text><text x="674" y="204" text-anchor="middle" class="small">1</text><text x="936" y="347" text-anchor="middle" class="small">2</text><text x="674" y="86" text-anchor="middle" class="small">2</text><circle cx="700" cy="315" r="18" fill="#dce5e9"/><text x="700" y="322" text-anchor="middle" style="fill:#294e60;font-size:21px;font-weight:700">0</text><circle cx="700" cy="197" r="18" fill="#15856e"/><text x="700" y="204" text-anchor="middle" style="fill:white;font-size:21px;font-weight:700">1</text><circle cx="818" cy="315" r="18" fill="#15856e"/><text x="818" y="322" text-anchor="middle" style="fill:white;font-size:21px;font-weight:700">1</text><circle cx="818" cy="197" r="18" fill="#dce5e9"/><text x="818" y="204" text-anchor="middle" style="fill:#294e60;font-size:21px;font-weight:700">0</text><text x="850" y="380" text-anchor="middle" class="bold green">입력이 서로 다를 때만 1</text></svg>