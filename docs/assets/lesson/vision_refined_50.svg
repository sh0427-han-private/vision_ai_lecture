<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="High score does not prove correct reasoning"><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e8194">MODEL EVALUATION / 50</text><text x="54" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#254658">High score does not prove correct reasoning</text><path d="M54 114L1386 114" fill="none" stroke="#e0ecf0" stroke-width="2"/><rect x="54" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="76" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Training shortcut</text><text x="76" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Background correlates with label</text><rect x="137" y="247" width="236" height="163" rx="7" fill="#f6e2e3" stroke="#e1babb" stroke-width="1.7"/><g transform="translate(186 259) scale(0.62)"><path d="M95 43C54 20 17 44 18 106C19 158 52 176 93 172C141 183 178 158 176 106C172 53 141 19 95 43Z" fill="#d9626a" stroke="#aa4954" stroke-width="3"/><path d="M96 44Q95 18 111 5" fill="none" stroke="#77503b" stroke-width="6"/><path d="M107 25Q138 -3 173 17Q140 34 107 25Z" fill="#70b58b" stroke="#4e866b" stroke-width="2"/></g><text x="83" y="450" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Model may learn background</text><rect x="510" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="532" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">New environment</text><text x="532" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Background color changes</text><rect x="594" y="247" width="236" height="163" rx="7" fill="#dce9ed" stroke="#bfd3df" stroke-width="1.7"/><g transform="translate(639 259) scale(0.62)"><path d="M95 43C54 20 17 44 18 106C19 158 52 176 93 172C141 183 178 158 176 106C172 53 141 19 95 43Z" fill="#d9626a" stroke="#aa4954" stroke-width="3"/><path d="M96 44Q95 18 111 5" fill="none" stroke="#77503b" stroke-width="6"/><path d="M107 25Q138 -3 173 17Q140 34 107 25Z" fill="#70b58b" stroke="#4e866b" stroke-width="2"/></g><text x="540" y="450" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Object is still the same</text><rect x="966" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="988" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Unexpected failure</text><text x="988" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">High confidence ≠ correct cue</text><rect x="1029" y="262" width="297" height="112" rx="8" fill="#fff3ed" stroke="#ebd7c5" stroke-width="1.7"/><text x="1053" y="302" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#254658">Score alone cannot prove</text><text x="1053" y="340" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">the model learned the defect</text><text x="994" y="450" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Check errors by camera / lighting</text><rect x="54" y="516" width="1332" height="60" rx="9" fill="#f0f7f9" stroke="#d5e5e9" stroke-width="1.7"/><text x="77" y="552" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Inspect difficult slices and changed conditions; a spurious background cue may fail.</text></svg>