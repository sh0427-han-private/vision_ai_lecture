xt x="991" y="447" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">18 + 2 + 4 + 76 = 100</text><rect x="54" y="516" width="1332" height="60" rx="9" fill="#f0f7f9" stroke="#d5e5e9" stroke-width="1.7"/><text x="77" y="552" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Positive / negative denote the chosen event; count TP, FN, FP, TN consistently.</text></svg>