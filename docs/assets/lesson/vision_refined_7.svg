<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Fixed rules versus patterns learned from data"><rect width="1440" height="610" fill="#fff"/><text x="54" y="49" text-anchor="start" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#378493">VISION AI FOUNDATIONS / 7</text><text x="54" y="92" text-anchor="start" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Fixed rules versus patterns learned from data</text><path d="M54 113H1386" stroke="#dfeaf0" stroke-width="2"/><rect x="54" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#cadce5" stroke-width="1.8"/><text x="76" y="180" text-anchor="start" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Rule-based system</text><text x="76" y="208" text-anchor="start" font-size="17" font-weight="500" font-family="Arial,Helvetica,sans-serif" fill="#6b8190">An engineer specifies criteria</text><rect x="122" y="265" width="274" height="111" rx="8" fill="#eef4f8" stroke="#cfdee7" stroke-width="1.8"/><text x="149" y="310" text-anchor="start" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">IF intensity &amp;lt; 90</text><text x="149" y="347" text-anchor="start" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">THEN reject</text><text x="89" y="442" text-anchor="start" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Rules are fixed until edited</text><rect x="510" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#cadce5" stroke-width="1.8"/><text x="532" y="180" text-anchor="start" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Supervised learning</text><text x="532" y="208" text-anchor="start" font-size="17" font-weight="500" font-family="Arial,Helvetica,sans-serif" fill="#6b8190">Data + labels guide weights</text><rect x="558" y="260" width="312" height="114" rx="8" fill="#e8f5ef" stroke="#c8e0d2" stroke-width="1.8"/><text x="588" y="306" text-anchor="start" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Images + target labels</text><text x="588" y="343" text-anchor="start" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Loss updates parameters</text><text x="542" y="443" text-anchor="start" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Model learns from examples</text><rect x="966" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#cadce5" stroke-width="1.8"/><text x="988" y="180" text-anchor="start" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">A new image</text><text x="988" y="208" text-anchor="start" font-size="17" font-weight="500" font-family="Arial,Helvetica,sans-serif" fill="#6b8190">Predict with learned parameters</text><rect x="1009" y="260" width="323" height="114" rx="8" fill="#fff7ed" stroke="#ead9bb" stroke-width="1.8"/><text x="1035" y="306" text-anchor="start" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Image → model output</text><text x="1035" y="343" text-anchor="start" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Check on unseen data</text><text x="996" y="443" text-anchor="start" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">Both methods need validation</text><rect x="54" y="516" width="1332" height="61" rx="10" fill="#eff6f8" stroke="#d5e6eb" stroke-width="1.8"/><text x="78" y="553" text-anchor="start" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#264c60">A learned model is not guaranteed to generalize; labels and deployment conditions matter.</text></svg>