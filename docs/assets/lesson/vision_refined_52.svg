<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Operational failures inform the next iteration"><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e8194">MODEL EVALUATION / 52</text><text x="54" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#254658">Operational failures inform the next iteration</text><path d="M54 114L1386 114" fill="none" stroke="#e0ecf0" stroke-width="2"/><rect x="54" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="76" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Live deployment</text><text x="76" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Unexpected input conditions</text><rect x="135" y="265" width="266" height="103" rx="8" fill="#eaf2f7" stroke="#c9dde7" stroke-width="1.7"/><text x="161" y="305" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#254658">Camera / illumination</text><text x="161" y="343" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">Product / process shift</text><rect x="510" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="532" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Collect failures</text><text x="532" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Store images with context</text><rect x="571" y="265" width="291" height="103" rx="8" fill="#fff3e9" stroke="#e7d1b8" stroke-width="1.7"/><text x="593" y="305" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">False alarm / miss</text><text x="593" y="343" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">Recheck ground truth</text><rect x="966" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="988" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Improve and compare</text><text x="988" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Retrain only with evidence</text><rect x="1017" y="265" width="307" height="103" rx="8" fill="#e9f6ee" stroke="#c6dfcf" stroke-width="1.7"/><text x="1044" y="305" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Update data or model</text><text x="1044" y="343" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#254658">Test against same baseline</text><rect x="54" y="516" width="1332" height="60" rx="9" fill="#f0f7f9" stroke="#d5e5e9" stroke-width="1.7"/><text x="77" y="552" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Monitor → collect representative failures → relabel → train → test → deploy again.</text></svg>