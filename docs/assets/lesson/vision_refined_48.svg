<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Precision and recall answer different questions"><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e8194">MODEL EVALUATION / 48</text><text x="54" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#254658">Precision and recall answer different questions</text><path d="M54 114L1386 114" fill="none" stroke="#e0ecf0" stroke-width="2"/><rect x="54" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="76" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Detection counts</text><text x="76" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Shared 100-case example</text><rect x="104" y="258" width="312" height="110" rx="7" fill="#edf5f8" stroke="#c5dce6" stroke-width="1.7"/><text x="130" y="302" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#254658">TP = 18   FP = 4</text><text x="130" y="342" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#254658">FN = 2    TN = 76</text><text x="89" y="451" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Positive predictions = 22</text><rect x="510" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="532" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Precision</text><text x="532" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Of predicted positives, how many right?</text><rect x="552" y="263" width="319" height="106" rx="7" fill="#e7f5f0" stroke="#bfdfd2" stroke-width="1.7"/><text x="578" y="310" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#254658">18 / (18 + 4)</text><text x="578" y="351" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#277c69">= 81.8%</text><text x="541" y="451" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#254658">Fewer false alarms → higher precision</text><rect x="966" y="141" width="420" height="340" rx="11" fill="#fff" stroke="#c7dce4" stroke-width="1.7"/><text x="988" y="180" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#254658">Recall</text><text x="988" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#64818f">Of actual positives, how many found?</text><rect x="1007" y="263" width="320" height="106" rx="7" fill="#eaf2f8" stroke="#cadee9" stroke-width="1.7"/><text x="1033" y="310" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#254658">18 / (18 + 2)</text><text x="1033" y="351" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#3c798d">= 90.0%</text><text x="998" y="451" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#254658">Fewer misses → higher recall</text><rect x="54" y="516" width="1332" height="60" rx="9" fill="#f0f7f9" stroke="#d5e5e9" stroke-width="1.7"/><text x="77" y="552" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254658">Example: precision = 18 / 22 ≈ 81.8%; recall = 18 / 20 = 90.0%.</text></svg>