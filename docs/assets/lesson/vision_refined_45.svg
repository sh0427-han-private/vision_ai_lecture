<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Low training loss is not enough"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769ba5"/></marker></defs><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="18" font-weight="700" fill="#338493">DATA AND TRANSFER LEARNING / 45</text><text x="54" y="93" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="35" font-weight="700" fill="#28495b">Low training loss is not enough</text><path d="M54 113H1386" stroke="#e1eaf0" stroke-width="2"/><rect x="54" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="75" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Training loss</text><text x="75" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">May keep decreasing</text><path d="M120 411H397 M120 411V242" stroke="#9db6c1" stroke-width="2" fill="none"/><path d="M133 266Q203 352 266 378T384 399" stroke="#4b9c85" stroke-width="5" fill="none"/><text x="110" y="448" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Seen training images</text><rect x="510" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="531" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Validation loss</text><text x="531" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Can rise after overfitting</text><path d="M572 411H859 M572 411V242" stroke="#9db6c1" stroke-width="2" fill="none"/><path d="M585 340Q669 391 711 340T842 266" stroke="#d08b5a" stroke-width="5" fill="none"/><text x="538" y="448" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">New validation images</text><rect x="966" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="987" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Generalization gap</text><text x="987" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Test on unseen conditions</text><rect x="1018" y="264" width="310" height="124" rx="8" fill="#eff5f8" stroke="#d2e0e6" stroke-width="1.7"/><text x="1043" y="313" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#28495b">Good train result</text><text x="1043" y="356" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#aa646d">≠ good deployment result</text><rect x="54" y="516" width="1332" height="60" rx="10" fill="#f0f7f8" stroke="#d8e7ea" stroke-width="1.7"/><text x="78" y="551" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Monitor validation data and representative test slices to diagnose overfitting and shortcut cues.</text></svg>