<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-label="Train / validation / test serve different roles"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769ba5"/></marker></defs><rect width="1440" height="610" fill="#fff"/><text x="54" y="50" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="18" font-weight="700" fill="#338493">DATA AND TRANSFER LEARNING / 39</text><text x="54" y="93" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="35" font-weight="700" fill="#28495b">Train / validation / test serve different roles</text><path d="M54 113H1386" stroke="#e1eaf0" stroke-width="2"/><rect x="54" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="75" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Train split</text><text x="75" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Learn model weights</text><rect x="120" y="260" width="284" height="103" rx="12" fill="#d8f0e7" stroke="#a4cfbd" stroke-width="1.7"/><text x="150" y="315" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="29" font-weight="700" fill="#357e74">70%  example</text><text x="82" y="444" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Used by the optimizer</text><rect x="510" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="531" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Validation split</text><text x="531" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Tune models and thresholds</text><rect x="568" y="260" width="284" height="103" rx="12" fill="#e7f1f6" stroke="#b1cbdc" stroke-width="1.7"/><text x="597" y="315" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="29" font-weight="700" fill="#47768e">15%  example</text><text x="539" y="444" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Never used to update weights</text><rect x="966" y="141" width="420" height="338" rx="12" fill="#fff" stroke="#ccdee5" stroke-width="1.7"/><text x="987" y="178" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="23" font-weight="700" fill="#28495b">Test split</text><text x="987" y="207" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="500" fill="#627d8c">Final unbiased assessment</text><rect x="1025" y="260" width="284" height="103" rx="12" fill="#fff3e6" stroke="#e6c9a9" stroke-width="1.7"/><text x="1053" y="315" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="29" font-weight="700" fill="#a47a4e">15%  example</text><text x="996" y="444" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Keep untouched until evaluation</text><rect x="54" y="516" width="1332" height="60" rx="10" fill="#f0f7f8" stroke="#d8e7ea" stroke-width="1.7"/><text x="78" y="551" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#28495b">Illustrative 70/15/15 allocation; actual proportions depend on dataset size and groups.</text></svg>