<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가중치 학습 실험 | AI Basics</title>
<style>
:root{font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:#fff;color:#1a3d50}
*{box-sizing:border-box}body{margin:0;padding:14px 18px}
.lab{display:grid;grid-template-columns:minmax(285px,.8fr) minmax(0,1.2fr);gap:24px;align-items:start}
.eyebrow{font-size:12px;color:#167f78;font-weight:850;letter-spacing:.06em}.title{font-size:19px;font-weight:850;margin:4px 0 16px}
.equation{padding:13px;background:#f1f8f6;border:1px solid #cde5df;border-radius:5px;text-align:center;font-size:23px;font-weight:800}
.small{font-size:12px;font-weight:550;color:#718995}
.slider-title{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:15px;font-weight:800}
input[type=range]{width:100%;accent-color:#198d82;cursor:pointer;margin:12px 0 0}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:#637f8e}
.actions{display:flex;gap:8px;margin:15px 0}
button{font:inherit;cursor:pointer;border-radius:5px;padding:8px 11px;background:#167c76;color:white;border:1px solid #167c76;font-size:13px;font-weight:750}
button.secondary{background:#fff;color:#36596a;border-color:#ccdce1}
button:focus-visible,input:focus-visible{outline:3px solid #8ad5d0;outline-offset:3px}
.flow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:750;color:#355b70}
.flow span{border:1px solid #d8e5eb;padding:7px 9px;border-radius:4px;min-width:0}.flow b{color:#76a9aa}
.chart-panel{padding:0 0 0 6px}.chart-top{display:flex;justify-content:space-between;align-items:center;gap:15px}
.metrics{display:flex;gap:10px}.metric{min-width:120px;padding:8px 12px;background:#f2f6f9;border-left:3px solid #7394aa}
.metric.loss{background:#fff7ed;border-color:#d99749}.metric small{display:block;font-size:11px;color:#617d8d;margin-bottom:2px}.metric strong{font-size:24px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;max-height:220px;margin-top:2px;display:block}
svg text{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#6c8592}
.legend{font-size:13px;display:flex;gap:14px;justify-content:flex-end;color:#5d7a8a;margin-top:-4px}
.dot{width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:5px}.dot.target{background:#33938e}.dot.predict{background:#db9a52}
.explain{font-size:13px;line-height:1.55;background:#f8fafb;color:#456273;border-left:3px solid #388f87;padding:10px 12px;margin:10px 0 0}
@media(max-width:650px){body{padding:9px}.lab{grid-template-columns:1fr;gap:9px}.title{margin:3px 0 8px}.equation{padding:8px;font-size:18px}.slider-title{margin-top:8px}.actions{margin:8px 0}.chart-top{align-items:stretch}.metric{min-width:0}.metric strong{font-size:18px}svg{max-height:150px}.flow{font-size:11px}.flow span{padding:5px 7px}}
</style>
</head>
<body>
<div class="lab">
  <div>
    <div class="eyebrow">01 · 바꿀 수 있는 Parameter</div>
    <h1 class="title">가중치 w를 움직이면 예측이 바뀝니다</h1>
    <div class="equation">예측 ŷ = <span id="w-formula">0.50</span> × 2 = <span id="prediction-formula">1.00</span></div>
    <div class="slider-title"><label for="weight">Weight w</label><strong id="weight-text">0.50</strong></div>
    <input id="weight" type="range" min="0" max="4" step="0.05" value="0.5" aria-label="가중치">
    <div class="ticks"><span>0</span><span>1</span><span>2 (정답에 맞는 값)</span><span>3</span><span>4</span></div>
    <div class="actions">
      <button type="button" id="learn">학습 한 단계 적용 ↗</button>
      <button type="button" id="reset" class="secondary">초기화</button>
    </div>
    <div class="flow"><span>입력 x = 2</span><b>→</b><span>가중치 w</span><b>→</b><span>예측 ŷ</span></div>
  </div>
  <div class="chart-panel">
    <div class="chart-top">
      <div class="eyebrow">02 · 결과를 실제 수치로 비교</div>
      <div class="metrics">
        <div class="metric"><small>모델 예측 ŷ</small><strong id="pred">1.00</strong></div>
        <div class="metric loss"><small>제곱 오차 Loss</small><strong id="loss">9.00</strong></div>
      </div>
    </div>
    <svg viewBox="0 0 480 226" role="img" aria-label="가중치 변화에 따른 예측 직선, 입력 x=2의 예측과 정답 비교">
      <g stroke="#e4ecef" stroke-width="1">
        <line x1="50" y1="190" x2="446" y2="190"/>
        <line x1="50" y1="140" x2="446" y2="140"/>
        <line x1="50" y1="90" x2="446" y2="90"/>
        <line x1="50" y1="40" x2="446" y2="40"/>
        <line x1="50" y1="190" x2="50" y2="20"/>
        <line x1="172" y1="190" x2="172" y2="20"/>
        <line x1="294" y1="190" x2="294" y2="20"/>
        <line x1="416" y1="190" x2="416" y2="20"/>
      </g>
      <line x1="50" y1="190" x2="446" y2="190" stroke="#78919e" stroke-width="2"/>
      <line x1="50" y1="190" x2="50" y2="20" stroke="#78919e" stroke-width="2"/>
      <text x="25" y="194">0</text><text x="24" y="144">2</text><text x="24" y="94">4</text><text x="24" y="44">6</text>
      <text x="48" y="210">0</text><text x="169" y="210">1</text><text x="291" y="210">2</text><text x="413" y="210">3</text><text x="452" y="194">x</text>
      <line x1="50" y1="190" x2="416" y2="40" stroke="#16897f" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="294" y1="190" x2="294" y2="25" stroke="#a0b9bf" stroke-dasharray="4 4"/>
      <line id="model-line" x1="50" y1="190" x2="416" y2="152.5" stroke="#d58f45" stroke-width="3"/>
      <line id="error-line" x1="294" x2="294" y1="165" y2="90" stroke="#be6b3e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="294" cy="90" r="7" fill="#16897f"/>
      <circle id="prediction-point" cx="294" cy="165" r="7" fill="#e19b50" stroke="#fff" stroke-width="2"/>
      <text x="306" y="85" fill="#16897f">정답 (2, 4)</text>
      <text id="prediction-label" x="306" y="163">예측 (2, 1.0)</text>
    </svg>
    <div class="legend"><span><i class="dot target"></i>정답 y=4</span><span><i class="dot predict"></i>모델 예측 ŷ</span></div>
    <p class="explain" id="explain" aria-live="polite">Loss = (1.00 − 4)² = 9.00. 학습은 이 오차를 줄이는 방향으로 Weight를 조절합니다.</p>
  </div>
</div>
<script>
(() => {
  "use strict";
  const input = document.getElementById("weight");
  const x = 2;
  const target = 4;
  const learningRate = 0.1;
  const yCanvas = y => 190 - y * 25;
  const format = v => v.toFixed(2);
  function render() {
    const w = Number(input.value);
    const prediction = w * x;
    const error = prediction - target;
    const loss = error * error;
    document.getElementById("w-formula").textContent = format(w);
    document.getElementById("weight-text").textContent = format(w);
    document.getElementById("prediction-formula").textContent = format(prediction);
    document.getElementById("pred").textContent = format(prediction);
    document.getElementById("loss").textContent = format(loss);
    const line = document.getElementById("model-line");
    line.setAttribute("y2", String(yCanvas(w * 3)));
    const marker = document.getElementById("prediction-point");
    marker.setAttribute("cy", String(yCanvas(prediction)));
    const errorLine = document.getElementById("error-line");
    errorLine.setAttribute("y1", String(yCanvas(prediction)));
    errorLine.setAttribute("y2", String(yCanvas(target)));
    const label = document.getElementById("prediction-label");
    label.setAttribute("y", String(Math.max(17, Math.min(207, yCanvas(prediction) + (prediction >= target ? 17 : -9)))));
    label.textContent = "예측 (2, " + format(prediction) + ")";
    document.getElementById("explain").textContent =
      "Loss = (" + format(prediction) + " − 4)² = " + format(loss) +
      ". 학습 버튼: w ← w − 0.1 × [2 × (" + format(prediction) + " − 4) × 2].";
  }
  input.addEventListener("input", render);
  document.getElementById("learn").addEventListener("click", () => {
    const current = Number(input.value);
    const gradient = 2 * (current * x - target) * x;
    const next = Math.max(0, Math.min(4, current - learningRate * gradient));
    input.value = String(Math.round(next / .05) * .05);
    render();
  });
  document.getElementById("reset").addEventListener("click", () => {
    input.value = "0.5";
    render();
  });
  render();
})();
</script>
</body>
</html>
