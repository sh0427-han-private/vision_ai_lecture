name: Lecture figure overlap diagnostic
on:
  pull_request:
    paths:
      - "scripts/audit_svg_text_layout.py"
      - "scripts/audit_svg_connectors.py"
      - "scripts/audit_visual_slides.py"
      - "scripts/verify_curriculum_overhaul.py"
      - "scripts/verify_learning_routes.py"
      - "docs/**"
      - ".github/workflows/figure-overlap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-svg-text:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify slide numbers, HWC shapes and resolution examples
        run: python scripts/verify_curriculum_overhaul.py
      - name: Audit SVG connectors
        run: python scripts/audit_svg_connectors.py
      - name: Install Playwright
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Check SVG text geometry
        run: |
          python -m http.server 8765 --directory docs >/tmp/figure-http.log 2>&1 &
          python scripts/audit_svg_text_layout.py
      - name: Render every slide and assert no visible intersections
        run: |
          python scripts/audit_visual_slides.py
          python - <<'PY'
          import json
          from pathlib import Path
          issues = json.loads(
              Path("visual_audit_output/issues.json").read_text("utf-8")
          )
          blocking = [
              x for x in issues
              if any(flag in x["issues"]
                     for flag in ("overlap", "bottom_overflow",
                                  "right_overflow", "broken_image",
                                  "shrink"))
          ]
          if blocking:
              print(json.dumps(blocking, ensure_ascii=False, indent=2))
              raise SystemExit(f"{len(blocking)} slide layout errors remain")
          print("196 viewport captures verified; no visible intersections.")
          PY

      - name: Check single-track navigation and chapter continuity
        run: python scripts/verify_learning_routes.py

      - name: Upload geometry report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-text-layout
          path: |
            visual_audit_output/svg_text_layout.json
            visual_audit_output/issues.json
          if-no-files-found: warn
