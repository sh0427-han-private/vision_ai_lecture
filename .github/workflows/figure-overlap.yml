name: Lecture figure overlap diagnostic
on:
  pull_request:
    paths:
      - "scripts/audit_svg_text_layout.py"
      - "scripts/audit_visual_slides.py"
      - "docs/**"
      - ".github/workflows/figure-overlap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-svg-text:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check SVG text geometry
        run: |
          python -m http.server 8765 --directory docs >/tmp/figure-http.log 2>&1 &
          python scripts/audit_svg_text_layout.py
      - name: Upload geometry report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-text-layout
          path: visual_audit_output/svg_text_layout.json
          if-no-files-found: warn
