name: Produce pretrained CNN feature-map demonstration

on:
  push:
    branches:
      - cnn-real-featuremaps-two-slides-20261016
    paths:
      - scripts/render_cnn_feature_maps.py
      - .github/workflows/generate-real-feature-maps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only pretrained CNN runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          python -m pip install pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Compute genuine ImageNet-pretrained activations
        run: python scripts/render_cnn_feature_maps.py
      - name: Commit generated educational figure to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/lesson/cnn_squeezenet_actual_feature_maps.png
          if ! git diff --cached --quiet; then
            git commit -m "Add computed pretrained SqueezeNet feature maps from dog photo"
            git push origin HEAD:cnn-real-featuremaps-two-slides-20261016
          fi
