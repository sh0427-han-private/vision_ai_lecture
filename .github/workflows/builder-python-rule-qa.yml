name: Builder Python-rule figure QA
on:
  pull_request:
    paths:
      - 'docs/vision_ai_course.html'
      - 'docs/rules_vs_learning.css'
      - 'scripts/verify_learning_routes.py'
      - '.github/workflows/builder-python-rule-qa.yml'
permissions:
  contents: read
jobs:
  browser-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium tests
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Test course navigation and interactive figures
        run: |
          python -m http.server 8765 --directory docs >/tmp/lecture-http.log 2>&1 &
          python scripts/verify_learning_routes.py
          python scripts/verify_intro_pixel_interactive.py
      - name: Test two updated slide geometries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          folder=Path('rule_python_qa')
          folder.mkdir(exist_ok=True)
          result=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              for width,height in ((1920,1080),(1366,768)):
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('pageerror',lambda error: errors.append(str(error)))
                  for number,concept in ((2,'rules'),(3,'rules-image')):
                      page.goto(f'http://127.0.0.1:8765/vision_ai_course.html#slide-{number}',wait_until='load')
                      page.wait_for_function('document.querySelector(".slide.active")?.dataset.fitScale !== undefined')
                      page.wait_for_timeout(240)
                      detail=page.evaluate('''() => {
                        const s=document.querySelector('.slide.active');
                        const inner=s.querySelector('.slide-inner');
                        const code=s.querySelector('pre');
                        const sr=s.getBoundingClientRect(),ir=inner.getBoundingClientRect();
                        const cr=code.getBoundingClientRect();
                        const pics=[...s.querySelectorAll('.rl-photo-card img')];
                        const bad=[...pics].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src);
                        const panes=[...s.querySelectorAll('.rl-pane')].map(x=>x.getBoundingClientRect());
                        return {concept:s.dataset.concept,scale:Number(s.dataset.fitScale),
                          inside:ir.top>=sr.top+1 && ir.bottom<=sr.bottom-2 && ir.right<=sr.right-2,
                          codeInside:cr.right<=ir.right+2 && code.scrollWidth<=code.clientWidth+2,
                          imageCount:pics.length,broken:bad,
                          panesSeparated:panes.length!==2 || panes[0].right<=panes[1].left+1};
                      }''')
                      print(json.dumps({'viewport':f'{width}x{height}','slide':number,**detail},ensure_ascii=False))
                      assert detail['concept']==concept and detail['scale']>=.85,detail
                      assert detail['inside'] and detail['codeInside'],detail
                      assert not detail['broken'] and detail['panesSeparated'],detail
                      if concept=='rules-image':
                          assert detail['imageCount']==6,detail
                      else:
                          python_code=page.locator('.rl-python-code').inner_text()
                          scope={}
                          exec(python_code,scope)
                          assert [scope['add'](1,1),scope['add'](2,1)]==[2,3]
                      page.screenshot(path=str(folder/f'slide-{number}-{width}x{height}.png'))
                      result.append({'slide':number,'viewport':f'{width}x{height}','fit':detail['scale'],'images':detail['imageCount']})
                  assert not errors,errors
                  page.close()
              browser.close()
          (folder/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Full lecture viewport audit
        run: |
          python scripts/audit_visual_slides.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('visual_audit_output/issues.json').read_text('utf-8'))
          target=[item for item in data if item.get('deck')=='vision_ai_course' and item.get('slide') in (2,3)]
          print('ALL_ISSUES:',len(data),'TARGET_ISSUES:',json.dumps(target,ensure_ascii=False))
          assert not target,target
          PY
      - name: Upload screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-rule-label-learning-qa
          path: |
            rule_python_qa/
            visual_audit_output/issues.json
          if-no-files-found: warn
          retention-days: 7
