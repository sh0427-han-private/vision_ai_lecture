name: Build editable PPT source
on:
  push:
    branches: [main]
    paths:
      - "docs/assets/ppt_slides/**"
      - "scripts/ppt_assets/svg_to_editable_pptx.py"
      - ".github/workflows/build-ppt-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vision-ai-ppt-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-editable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create editable PPTX
        run: |
          python -m pip install --disable-pip-version-check python-pptx
          python scripts/ppt_assets/svg_to_editable_pptx.py \
            docs/assets/ppt_slides/vision_ai_convolution_ppt.svg \
            slides/pptx_sources/Vision_AI_Convolution_PPT_Source.pptx
      - name: Commit generated PowerPoint into GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides/pptx_sources/Vision_AI_Convolution_PPT_Source.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Store editable Convolution PowerPoint slide source"
            git push origin HEAD:main
          fi
