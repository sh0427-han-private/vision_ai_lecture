name: Builder scoped rule-versus-learning browser QA
on:
  pull_request:
    paths:
      - 'docs/vision_ai_course.html'
      - 'docs/rules_vs_learning.css'
      - '.github/workflows/builder-rule-learning-qa.yml'

permissions:
  contents: read

jobs:
  two-slide-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Check both figures at two viewports
        run: |
          python -m http.server 8765 --directory docs >/tmp/rl-http.log 2>&1 &
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          folder=Path('rule_learning_qa')
          folder.mkdir(exist_ok=True)
          checks=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width,height in ((1920,1080),(1366,768)):
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  for slide_n,concept in ((2,'rules'),(3,'rules-image')):
                      page.goto(f'http://127.0.0.1:8765/vision_ai_course.html#slide-{slide_n}',wait_until='load')
                      page.wait_for_function('document.querySelector(".slide.active")?.dataset.fitScale !== undefined')
                      page.wait_for_timeout(300)
                      details=page.evaluate('''() => {
                        const s=document.querySelector('.slide.active');
                        const inner=s.querySelector('.slide-inner');
                        const sr=s.getBoundingClientRect(), ir=inner.getBoundingClientRect();
                        const r=el=>{const a=el.getBoundingClientRect();return {x:a.x,y:a.y,right:a.right,bottom:a.bottom}};
                        const imgs=[...s.querySelectorAll('img')].map(el=>({url:el.getAttribute('src'),loaded:el.complete && el.naturalWidth>0}));
                        const pair=[...s.querySelectorAll('.rl-pane')].map(r);
                        const caption=r(s.querySelector('.lesson-takeaway'));
                        const overlap=pair.length===2 && pair[0].right>pair[1].x+1;
                        return {concept:s.dataset.concept,scale:Number(s.dataset.fitScale),inner:r(inner),
                          slide:r(s),imageResults:imgs,photoCount:s.querySelectorAll('.rl-photo-card').length,
                          overlap,captionInside:caption.bottom<=sr.bottom-4,
                          innerInside:ir.bottom<=sr.bottom-4 && ir.right<=sr.right-4};
                      }''')
                      print(json.dumps({'size':f'{width}x{height}','slide':slide_n,**details},ensure_ascii=False))
                      assert details['concept']==concept
                      assert details['scale']>=.80,details
                      assert details['captionInside'] and details['innerInside'],details
                      assert not details['overlap'],details
                      assert all(i['loaded'] for i in details['imageResults']),details
                      if concept=='rules-image':
                          assert details['photoCount']==6
                          assert page.locator('.rl-photo-card--dark').count()==4
                          assert page.locator('.rl-learning-line').count()==2
                          assert page.locator('.rl-method-step').count()==3
                      checks.append({'size':f'{width}x{height}','slide':slide_n,'scale':details['scale'],'images':len(details['imageResults'])})
                      page.screenshot(path=str(folder/f'slide-{slide_n}-{width}x{height}.png'))
                  assert not errors,errors
                  page.close()
              browser.close()
          (folder/'checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-P15-P16-browser-qa
          path: rule_learning_qa/
          retention-days: 7
          if-no-files-found: warn
